<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách khách thuê - Quản lý phòng trọ</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <!-- Flash Messages thông báo kết quả -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm mb-4" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}">Thao tác thành công!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
            <h4 class="card-title mb-0 fw-bold text-primary">
                <i class="bi bi-people-fill me-2"></i>Danh sách khách thuê
            </h4>
            
            <div class="d-flex gap-2">
                <!-- Thanh tìm kiếm nhanh -->
                <form th:action="@{/tenants}" method="get" class="d-flex">
                    <div class="input-group">
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-sm" 
                               placeholder="Tìm tên, CCCD, SĐT...">
                        <button class="btn btn-sm btn-outline-secondary" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>

                <!-- Nút Thêm mới -->
                <a th:href="@{/tenants/new}" class="btn btn-sm btn-primary text-nowrap">
                    <i class="bi bi-person-plus me-1"></i> Thêm khách thuê
                </a>
            </div>
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-primary text-nowrap">
                        <tr>
                            <th class="text-center" style="width: 70px;">ID</th>
                            <th>Họ và tên</th>
                            <th>Số CCCD/CMND</th>
                            <th>Số điện thoại</th>
                            <th>Ngày sinh</th>
                            <th>Quê quán</th>
                            <th>Email</th>
                            <th class="text-center" style="width: 170px;">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Lặp danh sách khách thuê -->
                        <tr th:each="tenant : ${tenants}">
                            <td class="text-center fw-bold text-secondary" th:text="${tenant.tenantId}">1</td>
                            <td>
                                <span class="fw-bold text-dark" th:text="${tenant.fullName}">Nguyễn Văn A</span>
                            </td>
                            <td>
                                <span class="badge bg-secondary-subtle text-secondary-emphasis font-monospace" 
                                      th:text="${tenant.idNumber}">001201000123</span>
                            </td>
                            <td>
                                <a th:href="'tel:' + ${tenant.phone}" class="text-decoration-none text-primary fw-semibold">
                                    <i class="bi bi-telephone me-1"></i><span th:text="${tenant.phone}">0912345678</span>
                                </a>
                            </td>
                            <td th:text="${tenant.dateOfBirth != null ? #temporals.format(tenant.dateOfBirth, 'dd/MM/yyyy') : '—'}">
                                01/01/1995
                            </td>
                            <td th:text="${tenant.hometown != null ? tenant.hometown : '—'}">Hà Nội</td>
                            <td>
                                <span th:if="${tenant.email != null and !#strings.isEmpty(tenant.email)}">
                                    <i class="bi bi-envelope text-muted me-1"></i><span th:text="${tenant.email}">email@domain.com</span>
                                </span>
                                <span th:unless="${tenant.email != null and !#strings.isEmpty(tenant.email)}" class="text-muted">—</span>
                            </td>
                            <td class="text-center">
                                <!-- Nút Sửa -->
                                <a th:href="@{/tenants/edit/{id}(id=${tenant.tenantId})}" 
                                   class="btn btn-sm btn-outline-primary me-1" title="Chỉnh sửa">
                                    <i class="bi bi-pencil-square"></i> Sửa
                                </a>
                                <!-- Nút Xóa -->
                                <a th:href="@{/tenants/delete/{id}(id=${tenant.tenantId})}" 
                                   class="btn btn-sm btn-outline-danger" title="Xóa"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa khách thuê này không?');">
                                    <i class="bi bi-trash"></i> Xóa
                                </a>
                            </td>
                        </tr>

                        <!-- Thông báo khi không có dữ liệu -->
                        <tr th:if="${#lists.isEmpty(tenants)}">
                            <td colspan="8" class="text-center py-5 text-muted">
                                <i class="bi bi-person-x fs-2 d-block mb-2 text-secondary"></i>
                                Không tìm thấy khách thuê nào.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
