<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${(room.roomId != null or room.id != null) ? 'Chỉnh sửa phòng' : 'Thêm phòng mới'}">Thêm/Sửa phòng</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h4 class="card-title mb-0 fw-bold text-primary" 
                        th:text="${(room.roomId != null or room.id != null) ? 'Chỉnh sửa thông tin phòng' : 'Thêm phòng mới'}">
                        Thông tin phòng
                    </h4>
                </div>
                
                <div class="card-body p-4">
                    <!-- Form thêm/sửa liên kết Model Room -->
                    <form th:action="@{/rooms/save}" th:object="${room}" method="post">
                        <!-- Trường ID ẩn (dùng khi cập nhật) -->
                        <input type="hidden" th:field="*{roomId}" th:if="${room.roomId != null}" />
                        <input type="hidden" th:field="*{id}" th:if="${room.id != null and room.roomId == null}" />

                        <div class="row g-3">
                            <!-- 1. Mã phòng (room_code, NN) -->
                            <div class="col-md-6">
                                <label for="roomCode" class="form-label fw-semibold">Mã phòng <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="roomCode" th:field="*{roomCode}" 
                                       placeholder="Ví dụ: P101, A201" required maxlength="20">
                            </div>

                            <!-- 2. Dropdown Building (lặp th:each qua danh sách buildings truyền từ controller) -->
                            <div class="col-md-6">
                                <label for="building" class="form-label fw-semibold">Tòa nhà <span class="text-danger">*</span></label>
                                <select class="form-select" id="building" th:field="*{building}" required>
                                    <option value="" disabled selected>-- Chọn tòa nhà --</option>
                                    <option th:each="b : ${buildings}" 
                                            th:value="${b.buildingId != null ? b.buildingId : b.id}" 
                                            th:text="${b.buildingName}">
                                        Tòa A
                                    </option>
                                </select>
                            </div>

                            <!-- 3. Dropdown RoomType (loại phòng) -->
                            <div class="col-md-6" th:if="${roomTypes != null}">
                                <label for="roomType" class="form-label fw-semibold">Loại phòng <span class="text-danger">*</span></label>
                                <select class="form-select" id="roomType" th:field="*{roomType}">
                                    <option value="" disabled selected>-- Chọn loại phòng --</option>
                                    <option th:each="rt : ${roomTypes}" 
                                            th:value="${rt.roomTypeId != null ? rt.roomTypeId : rt.id}" 
                                            th:text="${rt.typeName}">
                                        Phòng đơn
                                    </option>
                                </select>
                            </div>

                            <!-- 4. Dropdown Status (Trống, Đang thuê, Bảo trì) -->
                            <div class="col-md-6">
                                <label for="status" class="form-label fw-semibold">Trạng thái <span class="text-danger">*</span></label>
                                <select class="form-select" id="status" th:field="*{status}" required>
                                    <option value="" disabled selected>-- Chọn trạng thái --</option>
                                    <option value="Trống">Trống</option>
                                    <option value="Đang thuê">Đang thuê</option>
                                    <option value="Bảo trì">Bảo trì</option>
                                </select>
                            </div>

                            <!-- 5. Tầng (floor_no) -->
                            <div class="col-md-4">
                                <label for="floorNo" class="form-label fw-semibold">Tầng</label>
                                <input type="number" class="form-control" id="floorNo" th:field="*{floorNo}" 
                                       placeholder="Tầng số" min="1">
                            </div>

                            <!-- 6. Sức chứa (max_occupants) -->
                            <div class="col-md-4">
                                <label for="maxOccupants" class="form-label fw-semibold">Sức chứa tối đa</label>
                                <input type="number" class="form-control" id="maxOccupants" th:field="*{maxOccupants}" 
                                       placeholder="Số người" min="1">
                            </div>

                            <!-- 7. Giá thuê riêng (price_override) -->
                            <div class="col-md-4">
                                <label for="priceOverride" class="form-label fw-semibold">Giá riêng (VNĐ)</label>
                                <input type="number" class="form-control" id="priceOverride" th:field="*{priceOverride}" 
                                       placeholder="Để trống nếu theo loại phòng" step="10000" min="0">
                            </div>
                        </div>

                        <!-- Các nút Thao tác -->
                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/rooms}" class="btn btn-secondary">
                                <i class="bi bi-x-circle me-1"></i> Quay lại
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-1"></i> Lưu thông tin
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
