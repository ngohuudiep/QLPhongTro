<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${building.buildingId != null ? 'Cập nhật tòa nhà' : 'Thêm tòa nhà mới'} + ' - Quản lý phòng trọ'">Thêm/Sửa tòa nhà</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h4 class="card-title mb-0 fw-bold text-primary" 
                        th:text="${building.buildingId != null ? 'Chỉnh sửa thông tin tòa nhà' : 'Thêm tòa nhà mới'}">
                        Thông tin tòa nhà
                    </h4>
                </div>
                
                <div class="card-body p-4">
                    <!-- Form thêm/sửa liên kết Model Building -->
                    <form th:action="@{/buildings/save}" th:object="${building}" method="post">
                        <!-- Trường ID ẩn (dùng khi cập nhật) -->
                        <input type="hidden" th:field="*{buildingId}" />

                        <div class="row g-3">
                            <!-- 1. Mã tòa nhà (building_code, NN) -->
                            <div class="col-md-6">
                                <label for="buildingCode" class="form-label fw-semibold">Mã tòa nhà <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="buildingCode" th:field="*{buildingCode}" 
                                       placeholder="Ví dụ: TN01, BLOCK-A" required maxlength="20">
                            </div>

                            <!-- 2. Tên tòa nhà (building_name, NN) -->
                            <div class="col-md-6">
                                <label for="buildingName" class="form-label fw-semibold">Tên tòa nhà <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="buildingName" th:field="*{buildingName}" 
                                       placeholder="Ví dụ: Tòa nhà Sunshine" required maxlength="150">
                            </div>

                            <!-- 3. Địa chỉ (address, NN) -->
                            <div class="col-12">
                                <label for="address" class="form-label fw-semibold">Địa chỉ chi tiết <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="address" th:field="*{address}" 
                                       placeholder="Ví dụ: Số 123 Đường Cầu Giấy, Phường Dịch Vọng" required maxlength="255">
                            </div>

                            <!-- 4. Thành phố (city) -->
                            <div class="col-md-6">
                                <label for="city" class="form-label fw-semibold">Thành phố / Tỉnh</label>
                                <input type="text" class="form-control" id="city" th:field="*{city}" 
                                       placeholder="Ví dụ: Hà Nội, TP. Hồ Chí Minh" maxlength="100">
                            </div>

                            <!-- 5. Tổng số tầng (total_floors) -->
                            <div class="col-md-6">
                                <label for="totalFloors" class="form-label fw-semibold">Tổng số tầng</label>
                                <input type="number" class="form-control" id="totalFloors" th:field="*{totalFloors}" 
                                       placeholder="Ví dụ: 5, 10" min="1" max="200">
                            </div>
                        </div>

                        <!-- Các nút Thao tác -->
                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/buildings}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i> Lưu thông tin
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
