# Local Windows demo profile. The launcher adds the verified SQL Server JDBC
# native authentication library folder to the application JVM library path.
spring.datasource.url=jdbc:sqlserver://localhost:1435;databaseName=ApartmentDB_v2;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;integratedSecurity=true;
spring.datasource.username=
spring.datasource.password=
app.security.remember-me-key=${APP_REMEMBER_ME_KEY:${random.uuid}}
spring.devtools.restart.enabled=false
logging.level.org.springframework.web.servlet=DEBUG
logging.level.org.springframework.security=DEBUG
