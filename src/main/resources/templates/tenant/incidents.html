<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Báo sự cố</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/theme.css}"><link rel="stylesheet" th:href="@{/css/tenant.css}"></head>
<body><div th:replace="~{layout/navbar :: navbar}"></div><main class="tenant-page py-4"><div class="container tenant-shell">
    <nav class="tenant-nav d-flex gap-2 mb-4"><a class="btn" th:href="@{/tenant/dashboard}">Tổng quan</a><a class="btn" th:href="@{/tenant/room}">Phòng đang thuê</a><a class="btn" th:href="@{/tenant/contracts}">Hợp đồng</a><a class="btn" th:href="@{/tenant/invoices}">Hóa đơn</a><a class="btn" th:href="@{/tenant/payments}">Thanh toán</a><a class="btn" th:href="@{/tenant/notifications}">Thông báo</a><a class="btn active" th:href="@{/tenant/incidents}">Báo sự cố</a></nav>
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <h1 class="h3 fw-bold mb-3">Gửi yêu cầu hỗ trợ / báo sự cố</h1>
    <form class="tenant-panel row g-3 mb-4" method="post" th:action="@{/tenant/incidents}" th:object="${incidentForm}">
        <div class="col-md-6"><label class="form-label">Phòng đang thuê</label><select class="form-select" th:field="*{contractId}" required><option value="">Chọn phòng</option><option th:each="contract : ${contracts}" th:value="${contract.contractId}" th:text="${contract.room.building.buildingName + ' — ' + contract.room.roomCode}"></option></select></div>
        <div class="col-md-3"><label class="form-label">Mức độ</label><select class="form-select" th:field="*{priority}"><option value="LOW">Thấp</option><option value="MEDIUM">Trung bình</option><option value="HIGH">Cao</option></select></div>
        <div class="col-md-3"><label class="form-label">Tiêu đề</label><input class="form-control" th:field="*{title}" maxlength="200" required></div>
        <div class="col-12"><label class="form-label">Mô tả chi tiết</label><textarea class="form-control" th:field="*{description}" rows="4" maxlength="2000" required></textarea></div>
        <div class="col-12"><button class="btn btn-primary" type="submit" th:disabled="${#lists.isEmpty(contracts)}"><i class="bi bi-send me-1"></i>Gửi yêu cầu</button><span class="text-secondary ms-2" th:if="${#lists.isEmpty(contracts)}">Cần có hợp đồng đang hoạt động để báo sự cố.</span></div>
    </form>
    <h2 class="h5 fw-bold mb-3">Yêu cầu đã gửi</h2>
    <section class="tenant-panel table-responsive" th:if="${!#lists.isEmpty(incidents)}"><table class="table tenant-table mb-0"><thead><tr><th>Ngày gửi</th><th>Phòng</th><th>Tiêu đề</th><th>Mức độ</th><th>Trạng thái</th></tr></thead><tbody>
        <tr th:each="incident : ${incidents}"><td th:text="${#temporals.format(incident.reportedAt, 'dd/MM/yyyy HH:mm')}"></td><td th:text="${incident.room.roomCode}"></td><td><strong th:text="${incident.title}"></strong><small class="d-block text-secondary" th:text="${incident.description}"></small></td><td th:text="${incident.priority}"></td><td th:text="${incident.status}"></td></tr>
    </tbody></table></section>
    <div class="tenant-empty" th:if="${#lists.isEmpty(incidents)}">Bạn chưa gửi yêu cầu hỗ trợ nào.</div>
</div></main></body></html>
