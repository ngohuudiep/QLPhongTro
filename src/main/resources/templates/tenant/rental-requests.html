<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yêu cầu thuê phòng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}"></head>
<body><div th:replace="~{layout/navbar :: navbar}"></div><main class="py-4"><div class="container">
    <h1 class="h3 mb-3">Yêu cầu thuê phòng của tôi</h1>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="table-responsive"><table class="table align-middle"><thead><tr><th>Phòng</th><th>Ngày gửi</th><th>Nhận phòng dự kiến</th><th>Số người</th><th>Trạng thái</th></tr></thead><tbody>
        <tr th:each="request : ${requests}">
            <td th:text="${request.room.roomCode}"></td>
            <td th:text="${#temporals.format(request.requestDate, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${request.expectedMoveInDate != null ? #temporals.format(request.expectedMoveInDate, 'dd/MM/yyyy') : '—'}"></td>
            <td th:text="${request.expectedOccupants}"></td>
            <td><span class="badge text-bg-primary" th:text="${request.status}"></span></td>
        </tr>
    </tbody></table></div>
</div></main></body></html>
