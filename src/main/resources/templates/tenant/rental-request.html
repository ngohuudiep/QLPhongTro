<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký thuê phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>
<main class="py-4"><div class="container" style="max-width:760px">
    <h1 class="h3 mb-3">Đăng ký thuê phòng <span th:text="${room.roomCode}"></span></h1>
    <form th:action="@{/tenant/rental/request}" method="post" class="card card-body shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="listingId" th:value="${room.listingId}">
        <div class="mb-3"><label class="form-label">Họ tên</label><input class="form-control" name="fullName" required maxlength="150"></div>
        <div class="row g-3 mb-3">
            <div class="col-md-6"><label class="form-label">Số điện thoại</label><input class="form-control" name="phone" required maxlength="20"></div>
            <div class="col-md-6"><label class="form-label">CCCD/CMND</label><input class="form-control" name="idNumber" required maxlength="20"></div>
        </div>
        <div class="row g-3 mb-3">
            <div class="col-md-6"><label class="form-label">Số người dự kiến ở</label><input class="form-control" type="number" name="expectedOccupants" min="1" th:max="${room.managedRoom != null ? room.managedRoom.maxOccupants : 10}" required></div>
            <div class="col-md-6"><label class="form-label">Ngày dự kiến nhận phòng</label><input class="form-control" type="date" name="expectedMoveInDate" required></div>
        </div>
        <div class="mb-3"><label class="form-label">Ghi chú gửi chủ trọ</label><textarea class="form-control" name="note" rows="4" maxlength="1000"></textarea></div>
        <button class="btn btn-primary" type="submit">Gửi yêu cầu thuê</button>
    </form>
</div></main>
</body></html>
