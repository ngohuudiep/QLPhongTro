<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yêu cầu chấm dứt - QLPhongTro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}"><link rel="stylesheet" th:href="@{/css/tenant.css}">
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>
<main class="tenant-page py-4"><div class="container tenant-shell">
    <nav class="tenant-nav d-flex flex-wrap gap-2 mb-4">
        <a class="btn" th:href="@{/tenant/dashboard}">Tổng quan</a>
        <a class="btn" th:href="@{/tenant/contracts}">Hợp đồng</a>
        <a class="btn active" th:href="@{/tenant/terminations}">Yêu cầu chấm dứt</a>
        <a class="btn" th:href="@{/tenant/invoices}">Hóa đơn</a>
        <a class="btn" th:href="@{/tenant/notifications}">Thông báo</a>
    </nav>
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <h1 class="h3 fw-bold mb-1">Lịch sử yêu cầu chấm dứt</h1>
    <p class="text-secondary mb-3">Phòng chỉ được giải phóng sau khi hai bên xác nhận thanh lý và nghĩa vụ thực tế được hoàn tất.</p>
    <form class="row g-2 mb-3" method="get" th:action="@{/tenant/terminations}">
        <div class="col-md-6"><input class="form-control" type="search" name="q" th:value="${q}" placeholder="Tìm mã hợp đồng, phòng hoặc mã yêu cầu"></div>
        <div class="col-md-4"><select class="form-select" name="status">
            <option value="ALL" th:selected="${selectedStatus == 'ALL'}">Tất cả trạng thái</option>
            <option value="PENDING_RESPONSE" th:selected="${selectedStatus == 'PENDING_RESPONSE'}">Chờ phản hồi</option>
            <option value="PENDING_SETTLEMENT" th:selected="${selectedStatus == 'PENDING_SETTLEMENT'}">Chờ thanh lý</option>
            <option value="DISPUTED" th:selected="${selectedStatus == 'DISPUTED'}">Tranh chấp</option>
            <option value="REJECTED" th:selected="${selectedStatus == 'REJECTED'}">Đã từ chối</option>
            <option value="CANCELLED" th:selected="${selectedStatus == 'CANCELLED'}">Đã hủy</option>
            <option value="COMPLETED" th:selected="${selectedStatus == 'COMPLETED'}">Đã hoàn tất</option>
        </select></div>
        <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Lọc</button></div>
    </form>
    <section class="tenant-panel table-responsive">
        <table class="table tenant-table align-middle mb-0">
            <thead><tr><th>Mã yêu cầu</th><th>Hợp đồng / phòng</th><th>Lý do</th><th>Ngày gửi</th><th>Ngày dự kiến</th><th>Trạng thái</th><th></th></tr></thead>
            <tbody>
            <tr th:each="item : ${requests}">
                <td th:text="${'#' + item.terminationRequestId}"></td>
                <td><span th:text="${item.contract.contractCode}"></span><small class="d-block text-secondary" th:text="${item.contract.room.roomCode}"></small></td>
                <td><span th:text="${item.reasonCode}"></span><small class="d-block text-secondary" th:text="${item.reasonDetails}"></small></td>
                <td th:text="${#temporals.format(item.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${#temporals.format(item.expectedTerminationDate, 'dd/MM/yyyy')}"></td>
                <td><span class="badge text-bg-light" th:text="${item.status}"></span></td>
                <td><a class="btn btn-sm btn-outline-primary" th:href="@{/tenant/terminations/{id}(id=${item.terminationRequestId})}">Chi tiết</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(requests)}"><td colspan="7" class="text-center text-secondary py-4">Chưa có yêu cầu chấm dứt nào.</td></tr>
            </tbody>
        </table>
        <nav th:if="${requestPage.totalPages > 1}" class="p-3" aria-label="Phân trang">
            <ul class="pagination justify-content-end mb-0">
                <li class="page-item" th:classappend="${requestPage.first ? ' disabled' : ''}"><a class="page-link" th:href="@{/tenant/terminations(status=${selectedStatus},q=${q},page=${requestPage.number - 1})}">Trước</a></li>
                <li class="page-item disabled"><span class="page-link" th:text="${requestPage.number + 1 + ' / ' + requestPage.totalPages}"></span></li>
                <li class="page-item" th:classappend="${requestPage.last ? ' disabled' : ''}"><a class="page-link" th:href="@{/tenant/terminations(status=${selectedStatus},q=${q},page=${requestPage.number + 1})}">Sau</a></li>
            </ul>
        </nav>
    </section>
</div></main>
</body></html>
