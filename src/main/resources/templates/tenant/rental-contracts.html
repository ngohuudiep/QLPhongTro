<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hợp đồng thuê phòng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}"></head>
<body><div th:replace="~{layout/navbar :: navbar}"></div><main class="py-4"><div class="container">
    <h1 class="h3 mb-3">Hợp đồng thuê phòng</h1>
    <div class="table-responsive"><table class="table align-middle"><thead><tr><th>Mã hợp đồng</th><th>Phòng</th><th>Thời hạn</th><th>Tiền cọc</th><th>Trạng thái</th><th></th></tr></thead><tbody>
        <tr th:each="contract : ${contracts}">
            <td th:text="${contract.contractCode}"></td><td th:text="${contract.room.roomCode}"></td>
            <td th:text="${(contract.startDate != null ? #temporals.format(contract.startDate,'dd/MM/yyyy') : '—') + ' - ' + (contract.endDate != null ? #temporals.format(contract.endDate,'dd/MM/yyyy') : 'Chưa bổ sung')}"></td>
            <td th:text="${contract.depositAmount != null ? #numbers.formatDecimal(contract.depositAmount,0,'COMMA',0,'POINT') + ' ₫' : 'Chưa cấu hình'}"></td>
            <td th:text="${contract.statusLabel}"></td>
            <td><a class="btn btn-sm btn-outline-primary" th:href="@{/tenant/rental/contracts/{id}(id=${contract.contractId})}">Xem</a></td>
        </tr>
    </tbody></table></div>
</div></main></body></html>
