<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hóa đơn của tôi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/theme.css}"><link rel="stylesheet" th:href="@{/css/tenant.css}"></head>
<body><div th:replace="~{layout/navbar :: navbar}"></div><main class="tenant-page py-4"><div class="container tenant-shell">
    <nav class="tenant-nav d-flex gap-2 mb-4"><a class="btn" th:href="@{/tenant/dashboard}">Tổng quan</a><a class="btn" th:href="@{/tenant/room}">Phòng đang thuê</a><a class="btn" th:href="@{/tenant/contracts}">Hợp đồng</a><a class="btn active" th:href="@{/tenant/invoices}">Hóa đơn</a><a class="btn" th:href="@{/tenant/payments}">Thanh toán</a><a class="btn" th:href="@{/tenant/notifications}">Thông báo</a></nav>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><h1 class="h3 fw-bold mb-0">Hóa đơn và thanh toán</h1><a th:href="@{/tenant/payments}">Lịch sử thanh toán</a></div>
    <form class="tenant-panel row g-2 align-items-end mb-3" method="get" th:action="@{/tenant/invoices}">
        <div class="col-sm-4"><label class="form-label">Trạng thái</label><select class="form-select" name="status"><option value="ALL" th:selected="${selectedStatus == 'ALL'}">Tất cả</option><option value="UNPAID" th:selected="${selectedStatus == 'UNPAID'}">Chưa thanh toán</option><option value="OVERDUE" th:selected="${selectedStatus == 'OVERDUE'}">Quá hạn</option><option value="PAID" th:selected="${selectedStatus == 'PAID'}">Đã thanh toán</option><option value="CANCELLED" th:selected="${selectedStatus == 'CANCELLED'}">Đã hủy</option></select></div>
        <div class="col-sm-4"><label class="form-label">Tháng</label><input class="form-control" type="month" name="month" th:value="${month}"></div>
        <div class="col-sm-4"><button class="btn btn-primary w-100" type="submit"><i class="bi bi-funnel me-1"></i>Lọc hóa đơn</button></div>
    </form>
    <section class="tenant-panel table-responsive" th:if="${!#lists.isEmpty(invoices)}"><table class="table tenant-table mb-0"><thead><tr><th>Kỳ</th><th>Mã hóa đơn</th><th>Phòng</th><th>Hạn thanh toán</th><th>Tổng tiền</th><th>Trạng thái</th><th></th></tr></thead><tbody>
        <tr th:each="invoice : ${invoices}"><td th:text="${#temporals.format(invoice.periodStart, 'MM/yyyy')}"></td><td class="fw-semibold" th:text="${invoice.invoiceCode}"></td><td th:text="${invoice.contract.room.roomCode}"></td><td th:text="${#temporals.format(invoice.dueDate, 'dd/MM/yyyy')}"></td><td class="fw-semibold" th:text="${#numbers.formatDecimal(invoice.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td><td><span class="badge text-bg-light" th:text="${invoice.statusLabel}"></span></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/tenant/invoices/{id}(id=${invoice.invoiceId})}">Chi tiết</a></td></tr>
    </tbody></table></section>
    <nav class="tenant-panel mt-3" aria-label="Phân trang hóa đơn" th:if="${invoicePage.totalPages > 1}">
        <ul class="pagination justify-content-end mb-0">
            <li class="page-item" th:classappend="${invoicePage.first ? 'disabled' : ''}"><a class="page-link" th:href="@{/tenant/invoices(status=${selectedStatus},month=${month},page=${invoicePage.number - 1})}">Trước</a></li>
            <li class="page-item" th:each="number : ${#numbers.sequence(0, invoicePage.totalPages - 1)}" th:classappend="${number == invoicePage.number ? 'active' : ''}"><a class="page-link" th:href="@{/tenant/invoices(status=${selectedStatus},month=${month},page=${number})}" th:text="${number + 1}"></a></li>
            <li class="page-item" th:classappend="${invoicePage.last ? 'disabled' : ''}"><a class="page-link" th:href="@{/tenant/invoices(status=${selectedStatus},month=${month},page=${invoicePage.number + 1})}">Sau</a></li>
        </ul>
    </nav>
    <div class="tenant-empty" th:if="${#lists.isEmpty(invoices)}">Không tìm thấy hóa đơn phù hợp. Hóa đơn sẽ xuất hiện tại đây sau khi chủ trọ gửi.</div>
</div></main></body></html>
