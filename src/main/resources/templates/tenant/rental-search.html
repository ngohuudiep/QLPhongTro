<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tìm phòng và đăng ký thuê</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>
<main class="py-4"><div class="container">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Tìm phòng và đăng ký thuê</h1>
        <a class="btn btn-outline-primary" th:href="@{/tenant/rental/requests}"><i class="bi bi-list-check me-1"></i>Yêu cầu của tôi</a>
    </div>
    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="room : ${rooms}">
            <article class="card h-100 shadow-sm">
                <img class="card-img-top" th:src="${room.imageUrl}" alt="Phòng trọ" style="height:190px;object-fit:cover">
                <div class="card-body">
                    <h2 class="h5" th:text="${room.title}"></h2>
                    <p class="text-secondary mb-2"><i class="bi bi-door-open me-1"></i><span th:text="${room.roomCode}"></span> · <span th:text="${room.area}"></span> m²</p>
                    <div class="fw-bold text-primary mb-3" th:text="${#numbers.formatDecimal(room.price, 0, 'COMMA', 0, 'POINT')} + ' ₫ / tháng'"></div>
                    <a class="btn btn-primary w-100"
                       th:href="@{/tenant/rental/request/{listingId}(listingId=${room.listingId})}">Chọn phòng và đăng ký thuê</a>
                </div>
            </article>
        </div>
    </div>
    <div class="alert alert-info mt-3" th:if="${#lists.isEmpty(rooms)}">Hiện chưa có phòng ở trạng thái còn trống.</div>
</div></main>
</body></html>
