<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lịch sử thanh toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/theme.css}"><link rel="stylesheet" th:href="@{/css/tenant.css}"></head>
<body><div th:replace="~{layout/navbar :: navbar}"></div><main class="tenant-page py-4"><div class="container tenant-shell">
    <nav class="tenant-nav d-flex gap-2 mb-4"><a class="btn" th:href="@{/tenant/dashboard}">Tổng quan</a><a class="btn" th:href="@{/tenant/room}">Phòng đang thuê</a><a class="btn" th:href="@{/tenant/contracts}">Hợp đồng</a><a class="btn" th:href="@{/tenant/invoices}">Hóa đơn</a><a class="btn active" th:href="@{/tenant/payments}">Thanh toán</a><a class="btn" th:href="@{/tenant/notifications}">Thông báo</a></nav>
    <h1 class="h3 fw-bold mb-3">Lịch sử thanh toán</h1>
    <section class="tenant-panel table-responsive" th:if="${!#lists.isEmpty(payments)}"><table class="table tenant-table mb-0"><thead><tr><th>Thời gian</th><th>Hóa đơn</th><th>Kỳ</th><th>Phương thức</th><th>Mã tham chiếu</th><th class="text-end">Số tiền</th></tr></thead><tbody>
        <tr th:each="payment : ${payments}"><td th:text="${payment.paidAt != null ? #temporals.format(payment.paidAt, 'dd/MM/yyyy HH:mm') : '—'}"></td><td><a th:href="@{/tenant/invoices/{id}(id=${payment.invoice.invoiceId})}" th:text="${payment.invoice.invoiceCode}"></a></td><td th:text="${#temporals.format(payment.invoice.periodStart, 'MM/yyyy')}"></td><td th:text="${payment.method}"></td><td th:text="${payment.referenceNo != null ? payment.referenceNo : '—'}"></td><td class="text-end fw-semibold" th:text="${#numbers.formatDecimal(payment.amount, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></td></tr>
    </tbody></table></section>
    <div class="tenant-empty" th:if="${#lists.isEmpty(payments)}">Chưa có khoản thanh toán nào được chủ trọ xác nhận.</div>
</div></main></body></html>
