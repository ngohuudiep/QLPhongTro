<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Phòng đang thuê</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/theme.css}"><link rel="stylesheet" th:href="@{/css/tenant.css}"></head>
<body><div th:replace="~{layout/navbar :: navbar}"></div><main class="tenant-page py-4"><div class="container tenant-shell">
    <nav class="tenant-nav d-flex gap-2 mb-4"><a class="btn" th:href="@{/tenant/dashboard}">Tổng quan</a><a class="btn active" th:href="@{/tenant/room}">Phòng đang thuê</a><a class="btn" th:href="@{/tenant/contracts}">Hợp đồng</a><a class="btn" th:href="@{/tenant/invoices}">Hóa đơn</a><a class="btn" th:href="@{/tenant/payments}">Thanh toán</a><a class="btn" th:href="@{/tenant/notifications}">Thông báo</a></nav>
    <h1 class="h3 fw-bold mb-3">Thông tin phòng đang thuê</h1>
    <section class="tenant-panel" th:if="${dashboard.activeContract != null}">
        <h2 class="h5 fw-bold mb-3" th:text="${dashboard.activeContract.room.building.buildingName + ' — ' + dashboard.activeContract.room.roomCode}"></h2>
        <div class="row g-3"><div class="col-md-6"><div class="tenant-detail-row"><span class="text-secondary d-block">Địa chỉ khu trọ</span><strong th:text="${dashboard.activeContract.room.building.address}"></strong></div></div>
            <div class="col-md-6"><div class="tenant-detail-row"><span class="text-secondary d-block">Tầng</span><strong th:text="${dashboard.activeContract.room.floorNo != null ? dashboard.activeContract.room.floorNo : '—'}"></strong></div></div>
            <div class="col-md-6"><div class="tenant-detail-row"><span class="text-secondary d-block">Giá thuê tháng</span><strong th:text="${(dashboard.activeContract.monthlyRent != null ? dashboard.activeContract.monthlyRent : dashboard.activeContract.room.priceOverride) != null ? #numbers.formatDecimal(dashboard.activeContract.monthlyRent != null ? dashboard.activeContract.monthlyRent : dashboard.activeContract.room.priceOverride, 0, 'COMMA', 0, 'POINT') + ' ₫' : '—'}"></strong></div></div>
            <div class="col-md-6"><div class="tenant-detail-row"><span class="text-secondary d-block">Trạng thái phòng</span><strong th:text="${dashboard.activeContract.room.status}"></strong></div></div>
            <div class="col-md-6"><div class="tenant-detail-row"><span class="text-secondary d-block">Ngày bắt đầu</span><strong th:text="${#temporals.format(dashboard.activeContract.startDate, 'dd/MM/yyyy')}"></strong></div></div>
            <div class="col-md-6"><div class="tenant-detail-row"><span class="text-secondary d-block">Ngày kết thúc</span><strong th:text="${#temporals.format(dashboard.activeContract.endDate, 'dd/MM/yyyy')}"></strong></div></div>
        </div>
    </section>
    <div class="tenant-empty" th:unless="${dashboard.activeContract != null}">Chưa có hợp đồng thuê đang hiệu lực được liên kết với tài khoản.</div>
</div></main></body></html>
