<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thông báo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/theme.css}"><link rel="stylesheet" th:href="@{/css/tenant.css}"></head>
<body><div th:replace="~{layout/navbar :: navbar}"></div><main class="tenant-page py-4"><div class="container tenant-shell">
    <nav class="tenant-nav d-flex gap-2 mb-4"><a class="btn" th:href="@{/tenant/dashboard}">Tổng quan</a><a class="btn" th:href="@{/tenant/room}">Phòng đang thuê</a><a class="btn" th:href="@{/tenant/contracts}">Hợp đồng</a><a class="btn" th:href="@{/tenant/invoices}">Hóa đơn</a><a class="btn" th:href="@{/tenant/payments}">Thanh toán</a><a class="btn active" th:href="@{/tenant/notifications}">Thông báo</a></nav>
    <h1 class="h3 fw-bold mb-3">Thông báo</h1>
    <div class="d-grid gap-2" th:if="${!#lists.isEmpty(notifications)}">
        <article class="tenant-panel d-flex flex-wrap justify-content-between align-items-center gap-3" th:each="notification : ${notifications}" th:classappend="${notification.read ? '' : ' border-primary'}">
            <div class="flex-grow-1"><div class="d-flex align-items-center gap-2"><i class="bi bi-receipt text-primary"></i><strong th:text="${notification.title}"></strong><span class="badge text-bg-primary" th:if="${!notification.read}">Mới</span></div>
                <p class="mb-1 mt-2" th:text="${notification.message}"></p><small class="text-secondary" th:text="${#temporals.format(notification.createdAt, 'dd/MM/yyyy HH:mm')}"></small></div>
            <form method="post" th:action="@{/tenant/notifications/{id}/open(id=${notification.notificationId})}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-outline-primary" type="submit">Mở chi tiết <i class="bi bi-arrow-right"></i></button>
            </form>
        </article>
    </div>
    <div class="tenant-empty" th:if="${#lists.isEmpty(notifications)}">Bạn chưa có thông báo nào.</div>
</div></main></body></html>
