<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách tài sản - Quản lý phòng trọ</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm mb-4" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h4 class="card-title mb-0 fw-bold text-primary">
                <i class="bi bi-box-seam me-2"></i>Danh sách tài sản trong phòng (Assets)
            </h4>
            <a th:href="@{/assets/new}" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Thêm tài sản mới
            </a>
        </div>
        
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-primary text-nowrap">
                        <tr>
                            <th class="text-center" style="width: 70px;">ID</th>
                            <th>Tên tài sản</th>
                            <th>Phòng</th>
                            <th class="text-center">Số lượng</th>
                            <th>Tình trạng</th>
                            <th class="text-center">Ngày mua</th>
                            <th class="text-center" style="width: 160px;">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="a : ${assets}">
                            <td class="text-center fw-bold text-secondary" th:text="${a.roomAssetId}">1</td>
                            <td class="fw-bold text-dark" th:text="${a.assetName}">Điều hòa Daikin 9000BTU</td>
                            <td>
                                <span class="badge bg-light text-primary border fw-semibold" 
                                      th:text="${a.room != null ? a.room.roomCode : '—'}">P.101</span>
                            </td>
                            <td class="text-center fw-semibold" th:text="${a.quantity}">1</td>
                            <td>
                                <span th:if="${a.conditionStatus == 'Mới 100%' or a.conditionStatus == 'Tốt'}" class="badge bg-success-subtle text-success border border-success-subtle" th:text="${a.conditionStatus}"></span>
                                <span th:if="${a.conditionStatus == 'Bình thường'}" class="badge bg-info-subtle text-info-emphasis border border-info-subtle" th:text="${a.conditionStatus}"></span>
                                <span th:if="${a.conditionStatus == 'Cần bảo trì' or a.conditionStatus == 'Hỏng'}" class="badge bg-danger-subtle text-danger border border-danger-subtle" th:text="${a.conditionStatus}"></span>
                                <span th:if="${a.conditionStatus != 'Mới 100%' and a.conditionStatus != 'Tốt' and a.conditionStatus != 'Bình thường' and a.conditionStatus != 'Cần bảo trì' and a.conditionStatus != 'Hỏng'}" class="badge bg-secondary" th:text="${a.conditionStatus != null ? a.conditionStatus : '—'}"></span>
                            </td>
                            <td class="text-center" th:text="${a.purchaseDate != null ? #temporals.format(a.purchaseDate, 'dd/MM/yyyy') : '—'}">10/01/2026</td>
                            <td class="text-center">
                                <a th:href="@{/assets/edit/{id}(id=${a.roomAssetId})}" class="btn btn-sm btn-outline-primary me-1" title="Sửa">
                                    <i class="bi bi-pencil-square"></i> Sửa
                                </a>
                                <a th:href="@{/assets/delete/{id}(id=${a.roomAssetId})}" class="btn btn-sm btn-outline-danger" title="Xóa"
                                   onclick="return confirm('Bạn có chắc muốn xóa tài sản này?');">
                                    <i class="bi bi-trash"></i> Xóa
                                </a>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(assets)}">
                            <td colspan="7" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2 text-secondary"></i>
                                Chưa có tài sản nào được đăng ký trong các phòng.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
