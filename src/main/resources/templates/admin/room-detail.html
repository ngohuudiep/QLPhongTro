<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết phòng - QLPhongTro Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-app"><div class="admin-layout">
    <div th:replace="~{admin/fragments :: sidebar('rooms')}"></div>
    <main class="admin-main">
        <div th:replace="~{admin/fragments :: topbar('Chi tiết phòng')}"></div>
        <div class="admin-content">
            <section class="admin-panel p-3 p-md-4">
                <div class="row g-4">
                    <div class="col-lg-5"><img class="img-fluid rounded-3 w-100" style="max-height:360px;object-fit:cover" th:src="${room.imageUrl}" alt="Ảnh phòng"></div>
                    <div class="col-lg-7">
                        <div class="d-flex justify-content-between gap-2"><div><div class="text-secondary small" th:text="${room.roomCode}">P101</div><h2 class="h4 fw-bold" th:text="${room.title}">Phòng</h2></div><span class="badge align-self-start" th:classappend="${room.status == 'TRONG' ? 'text-bg-success' : (room.status == 'DA_THUE' ? 'text-bg-primary' : 'text-bg-warning')}" th:text="${room.statusLabel}">Trạng thái</span></div>
                        <dl class="row mt-3">
                            <dt class="col-sm-4">Chủ trọ</dt><dd class="col-sm-8" th:text="${room.createdBy != null ? (room.createdBy.fullName + ' (' + room.createdBy.username + ')') : 'Chưa gán'}">—</dd>
                            <dt class="col-sm-4">Giá thuê</dt><dd class="col-sm-8" th:text="${#numbers.formatDecimal(room.price, 0, 'COMMA', 0, 'POINT') + ' ₫ / tháng'}">—</dd>
                            <dt class="col-sm-4">Diện tích</dt><dd class="col-sm-8" th:text="${room.area + ' m²'}">—</dd>
                            <dt class="col-sm-4">Tầng</dt><dd class="col-sm-8" th:text="${room.floorNo}">—</dd>
                            <dt class="col-sm-4">Người thuê</dt><dd class="col-sm-8" th:text="${room.currentTenant ?: '—'}">—</dd>
                            <dt class="col-sm-4">Mô tả</dt><dd class="col-sm-8" th:text="${room.description ?: '—'}">—</dd>
                            <dt class="col-sm-4">Tiện nghi</dt><dd class="col-sm-8" th:text="${room.amenities ?: '—'}">—</dd>
                        </dl>
                        <div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/admin/rooms}">Quay lại</a><a class="btn btn-primary" th:href="@{/admin/rooms/edit/{id}(id=${room.listingId})}">Chỉnh sửa</a></div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
