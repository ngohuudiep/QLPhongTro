<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Khu trọ - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-app"><div class="admin-layout">
    <div th:replace="~{admin/fragments :: sidebar('buildings')}"></div>
    <main class="admin-main">
        <div th:replace="~{admin/fragments :: topbar(${building.buildingId == null ? 'Thêm khu trọ' : 'Cập nhật khu trọ'})}"></div>
        <div class="admin-content"><div th:replace="~{admin/fragments :: alerts}"></div>
            <section class="admin-panel p-3 p-md-4"><form th:action="@{/admin/buildings/save}" th:object="${building}" method="post" class="row g-3">
                <input type="hidden" th:field="*{buildingId}">
                <div class="col-md-4"><label class="form-label">Mã khu trọ *</label><input class="form-control" th:field="*{buildingCode}" maxlength="20" required></div>
                <div class="col-md-8"><label class="form-label">Tên khu trọ *</label><input class="form-control" th:field="*{buildingName}" maxlength="150" required></div>
                <div class="col-12"><label class="form-label">Địa chỉ *</label><input class="form-control" th:field="*{address}" maxlength="255" required></div>
                <div class="col-md-6"><label class="form-label">Tỉnh / thành phố</label><input class="form-control" th:field="*{city}" maxlength="100"></div>
                <div class="col-md-2"><label class="form-label">Số tầng</label><input class="form-control" type="number" th:field="*{totalFloors}" min="1"></div>
                <div class="col-md-4"><label class="form-label">Chủ trọ sở hữu</label><select class="form-select" name="ownerId"><option value="">Chưa gán</option><option th:each="owner : ${owners}" th:value="${owner.userId}" th:selected="${building.owner != null and building.owner.userId == owner.userId}" th:text="${owner.fullName + ' (' + owner.username + ')'}"></option></select></div>
                <div class="col-12 d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" th:href="@{/admin/buildings}">Hủy</a><button class="btn btn-primary" type="submit">Lưu khu trọ</button></div>
            </form></section>
        </div>
    </main>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body>
</html>
