<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông tin tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4" style="max-width: 720px">
    <h1 class="h3 mb-3" th:text="${form.userId == null ? 'Tạo tài khoản' : 'Sửa tài khoản'}"></h1>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <form method="post" th:action="@{/admin/users/save}" th:object="${form}" class="card card-body gap-3">
        <input type="hidden" th:field="*{userId}">
        <label>Tên đăng nhập<input class="form-control" th:field="*{username}" required maxlength="50"></label>
        <label>Họ tên<input class="form-control" th:field="*{fullName}" required maxlength="150"></label>
        <label>Email<input class="form-control" type="email" th:field="*{email}" required maxlength="100"></label>
        <label>Số điện thoại<input class="form-control" th:field="*{phone}" required maxlength="20"></label>
        <label>Mật khẩu <small th:text="${form.userId == null ? '(bắt buộc, tối thiểu 8 ký tự)' : '(để trống nếu không đổi)'}"></small>
            <input class="form-control" type="password" th:field="*{password}" th:required="${form.userId == null}"></label>
        <label>Vai trò<select class="form-select" th:field="*{roleName}" required>
            <option value="ADMIN">ADMIN</option><option value="STAFF">STAFF</option>
        </select></label>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Lưu</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Quay lại</a>
        </div>
    </form>
</main>
</body>
</html>
