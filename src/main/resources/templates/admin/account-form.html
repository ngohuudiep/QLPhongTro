<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${editing ? 'Cập nhật' : 'Thêm'} + ' tài khoản ' + ${categoryTitle}">Tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-app"><div class="admin-layout">
    <div th:replace="~{admin/fragments :: sidebar(${activePage})}"></div>
    <main class="admin-main">
        <div th:replace="~{admin/fragments :: topbar(${editing ? 'Cập nhật' : 'Thêm'} + ' ' + ${categoryTitle})}"></div>
        <div class="admin-content">
            <div th:replace="~{admin/fragments :: alerts}"></div>
            <section class="admin-panel p-3 p-md-4">
                <form th:action="@{/admin/accounts/{category}/save(category=${category})}" th:object="${accountForm}" method="post" class="row g-3">
                    <input type="hidden" th:field="*{userId}">
                    <div class="col-md-6"><label class="form-label">Tên đăng nhập</label>
                        <input class="form-control" th:field="*{username}" th:readonly="${editing}" th:required="${!editing}" minlength="4" maxlength="50">
                        <div class="form-text" th:if="${editing}">Tên đăng nhập không thể thay đổi.</div>
                    </div>
                    <div class="col-md-6"><label class="form-label">Họ và tên</label><input class="form-control" th:field="*{fullName}" maxlength="150" required></div>
                    <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" th:field="*{email}" maxlength="100" required></div>
                    <div class="col-md-6"><label class="form-label">Số điện thoại</label><input class="form-control" type="tel" th:field="*{phone}" maxlength="20" required></div>
                    <div class="col-md-6"><label class="form-label" th:text="${editing ? 'Mật khẩu mới (không bắt buộc)' : 'Mật khẩu'}">Mật khẩu</label>
                        <input class="form-control" type="password" th:field="*{password}" th:required="${!editing}" minlength="8" autocomplete="new-password">
                        <div class="form-text" th:text="${editing ? 'Để trống để giữ nguyên mật khẩu hiện tại.' : 'Tối thiểu 8 ký tự.'}"></div>
                    </div>
                    <div class="col-12"><div class="alert alert-info py-2 mb-0 small" th:if="${!editing}">Tài khoản tạo bởi Admin được duyệt ngay. Đăng ký công khai của chủ trọ vẫn phải qua xét duyệt.</div></div>
                    <div class="col-12 d-flex justify-content-end gap-2">
                        <a class="btn btn-outline-secondary" th:href="@{/admin/accounts/{category}(category=${category})}">Hủy</a>
                        <button class="btn btn-primary" type="submit"><i class="bi bi-check2 me-1"></i>Lưu tài khoản</button>
                    </div>
                </form>
            </section>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
