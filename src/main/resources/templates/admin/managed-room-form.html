<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phòng - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-app"><div class="admin-layout">
    <div th:replace="~{admin/fragments :: sidebar('managed-rooms')}"></div>
    <main class="admin-main">
        <div th:replace="~{admin/fragments :: topbar(${room.roomId == null ? 'Thêm phòng' : 'Cập nhật phòng'})}"></div>
        <div class="admin-content"><div th:replace="~{admin/fragments :: alerts}"></div>
            <section class="admin-panel p-3 p-md-4"><form th:action="@{/admin/managed-rooms/save}" th:object="${room}" method="post" class="row g-3">
                <input type="hidden" th:field="*{roomId}">
                <div class="col-md-6"><label class="form-label">Mã phòng *</label><input class="form-control" th:field="*{roomCode}" maxlength="20" required></div>
                <div class="col-md-6"><label class="form-label">Khu trọ *</label><select class="form-select" name="buildingId" required><option value="">Chọn khu trọ</option><option th:each="building : ${buildings}" th:value="${building.buildingId}" th:selected="${room.building != null and room.building.buildingId == building.buildingId}" th:text="${building.buildingName + ' — ' + building.address}"></option></select></div>
                <div class="col-md-4"><label class="form-label">Tầng</label><input class="form-control" type="number" th:field="*{floorNo}" min="0"></div>
                <div class="col-md-4"><label class="form-label">Sức chứa</label><input class="form-control" type="number" th:field="*{maxOccupants}" min="1"></div>
                <div class="col-md-4"><label class="form-label">Giá thuê riêng (VNĐ)</label><input class="form-control" type="number" th:field="*{priceOverride}" min="0" step="1000"></div>
                <div class="col-md-6"><label class="form-label">Trạng thái</label><select class="form-select" th:field="*{status}"><option value="TRONG">Còn trống</option><option value="BAO_TRI">Bảo trì</option><option th:if="${room.roomId != null and (room.status == 'DA_THUE' or room.status == 'Đang thuê')}" value="DA_THUE">Đang thuê</option></select></div>
                <div class="col-12 small text-secondary">Mô hình Rooms hiện không có cột mô tả/hình ảnh/diện tích. Trạng thái Đang thuê chỉ hợp lệ khi đã có hợp đồng đang hiệu lực.</div>
                <div class="col-12 d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" th:href="@{/admin/managed-rooms}">Hủy</a><button class="btn btn-primary" type="submit">Lưu phòng</button></div>
            </form></section>
        </div>
    </main>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body>
</html>
