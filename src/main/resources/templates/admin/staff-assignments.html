<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff building assignments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>
<main class="container py-4">
    <h1 class="h3 mb-4">Staff building assignments</h1>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form method="post" th:action="@{/admin/staff-assignments}" class="row g-3 mb-4">
        <div class="col-md-5">
            <label class="form-label" for="staffUserId">Staff account</label>
            <select class="form-select" id="staffUserId" name="staffUserId" required>
                <option value="" disabled selected>Select staff</option>
                <option th:each="staff : ${staffUsers}" th:value="${staff.userId}"
                        th:text="${staff.username}"></option>
            </select>
        </div>
        <div class="col-md-5">
            <label class="form-label" for="buildingId">Building</label>
            <select class="form-select" id="buildingId" name="buildingId" required>
                <option value="" disabled selected>Select building</option>
                <option th:each="building : ${buildings}" th:value="${building.buildingId}"
                        th:text="${building.buildingName}"></option>
            </select>
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button class="btn btn-primary w-100" type="submit">Assign</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>Staff</th><th>Building</th><th></th></tr></thead>
            <tbody>
            <tr th:each="assignment : ${assignments}">
                <td th:text="${assignment.staff.username}"></td>
                <td th:text="${assignment.building.buildingName}"></td>
                <td class="text-end">
                    <form method="post" th:action="@{/admin/staff-assignments/delete}">
                        <input type="hidden" name="assignmentId" th:value="${assignment.assignmentId}">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Remove</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(assignments)}"><td colspan="3" class="text-muted">No assignments.</td></tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
