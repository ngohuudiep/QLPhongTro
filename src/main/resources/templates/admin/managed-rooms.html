<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phòng quản lý - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-app"><div class="admin-layout">
    <div th:replace="~{admin/fragments :: sidebar('managed-rooms')}"></div>
    <main class="admin-main">
        <div th:replace="~{admin/fragments :: topbar('Phòng quản lý')}"></div>
        <div class="admin-content"><div th:replace="~{admin/fragments :: alerts}"></div>
            <section class="admin-panel">
                <div class="admin-panel-heading"><div><h2>Phòng trong Buildings/Rooms</h2><small class="text-secondary">Dữ liệu phòng và khu trọ nội bộ, tách biệt với bài đăng công khai.</small></div><div class="d-flex gap-2"><a class="btn btn-outline-primary btn-sm" th:href="@{/admin/buildings}">Khu trọ</a><a class="btn btn-primary btn-sm" th:href="@{/admin/managed-rooms/new}">Thêm phòng</a></div></div>
                <form method="get" th:action="@{/admin/managed-rooms}" class="p-3 border-bottom"><div class="row g-2">
                    <div class="col-lg-5"><input class="form-control" type="search" name="keyword" th:value="${keyword}" placeholder="Mã phòng, khu trọ hoặc địa chỉ"></div>
                    <div class="col-sm-6 col-lg-3"><select class="form-select" name="ownerId"><option value="">Tất cả chủ trọ</option><option th:each="owner : ${owners}" th:value="${owner.userId}" th:selected="${selectedOwnerId != null and selectedOwnerId == owner.userId}" th:text="${owner.fullName + ' (' + owner.username + ')'}"></option></select></div>
                    <div class="col-sm-6 col-lg-2"><select class="form-select" name="status"><option value="ALL" th:selected="${selectedStatus == 'ALL'}">Mọi trạng thái</option><option value="TRONG" th:selected="${selectedStatus == 'TRONG'}">Còn trống</option><option value="DA_THUE" th:selected="${selectedStatus == 'DA_THUE'}">Đang thuê</option><option value="BAO_TRI" th:selected="${selectedStatus == 'BAO_TRI'}">Bảo trì</option></select></div>
                    <div class="col-lg-2 d-flex gap-2"><button class="btn btn-outline-primary flex-fill" type="submit">Lọc</button><a class="btn btn-outline-secondary" th:href="@{/admin/managed-rooms}"><i class="bi bi-arrow-counterclockwise"></i></a></div>
                </div></form>
                <div class="table-responsive"><table class="table table-hover admin-table">
                    <thead><tr><th class="ps-3">Mã phòng</th><th>Khu trọ / địa chỉ</th><th>Chủ sở hữu</th><th>Tầng / sức chứa</th><th>Giá riêng</th><th>Trạng thái</th><th class="text-end pe-3">Thao tác</th></tr></thead>
                    <tbody>
                    <tr th:each="room : ${rooms}">
                        <td class="ps-3 fw-semibold" th:text="${room.roomCode}">P101</td>
                        <td><span th:text="${room.building.buildingName}">Khu trọ</span><small class="d-block text-secondary" th:text="${room.building.address}">Địa chỉ</small></td>
                        <td th:text="${room.building.owner != null ? (room.building.owner.fullName + ' (' + room.building.owner.username + ')') : 'Chưa gán'}">—</td>
                        <td><span th:text="${room.floorNo != null ? 'Tầng ' + room.floorNo : '—'}">—</span><small class="d-block text-secondary" th:text="${room.maxOccupants != null ? room.maxOccupants + ' người' : 'Sức chứa chưa khai báo'}">—</small></td>
                        <td th:text="${room.priceOverride != null ? #numbers.formatDecimal(room.priceOverride, 0, 'COMMA', 0, 'POINT') + ' ₫' : 'Theo giá khu trọ'}">—</td>
                        <td><span class="badge" th:classappend="${room.status == 'TRONG' or room.status == 'Trống' ? 'text-bg-success' : (room.status == 'DA_THUE' or room.status == 'Đang thuê' ? 'text-bg-primary' : 'text-bg-warning')}" th:text="${room.status}">Status</span></td>
                        <td class="text-end pe-3"><div class="d-inline-flex gap-1">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/managed-rooms/{id}(id=${room.roomId})}" title="Chi tiết"><i class="bi bi-eye"></i></a>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/managed-rooms/{id}/edit(id=${room.roomId})}" title="Sửa"><i class="bi bi-pencil"></i></a>
                            <form method="post" th:action="@{/admin/managed-rooms/{id}/delete(id=${room.roomId})}" onsubmit="return confirm('Xóa phòng này? Phòng có hợp đồng hoặc lịch sử sẽ được giữ lại.');"><button class="btn btn-sm btn-outline-danger" type="submit" title="Xóa"><i class="bi bi-trash"></i></button></form>
                        </div></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(rooms)}"><td colspan="7" class="admin-empty">Không có phòng phù hợp. Hãy tạo khu trọ trước khi thêm phòng.</td></tr>
                    </tbody>
                </table></div>
            </section>
        </div>
    </main>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body>
</html>
