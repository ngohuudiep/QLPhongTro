<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Tài khoản ' + ${categoryTitle} + ' - QLPhongTro'">Tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-app"><div class="admin-layout">
    <div th:replace="~{admin/fragments :: sidebar(${activePage})}"></div>
    <main class="admin-main">
        <div th:replace="~{admin/fragments :: topbar('Tài khoản ' + ${categoryTitle})}"></div>
        <div class="admin-content">
            <div th:replace="~{admin/fragments :: alerts}"></div>
            <section class="admin-panel">
                <div class="admin-panel-heading"><div><h2>Danh sách <span th:text="${categoryTitle.toLowerCase()}"></span></h2><small class="text-secondary">Tìm theo họ tên, email, số điện thoại hoặc tên đăng nhập.</small></div>
                    <a class="btn btn-primary btn-sm" th:href="@{/admin/accounts/{category}/new(category=${category})}"><i class="bi bi-person-plus me-1"></i>Thêm tài khoản</a></div>
                <form class="p-3 border-bottom" method="get" th:action="@{/admin/accounts/{category}(category=${category})}">
                    <div class="input-group"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Nhập từ khóa tìm kiếm"><button class="btn btn-outline-primary" type="submit"><i class="bi bi-search me-1"></i>Tìm</button><a class="btn btn-outline-secondary" th:href="@{/admin/accounts/{category}(category=${category})}">Xóa lọc</a></div>
                </form>
                <div class="table-responsive">
                    <table class="table table-hover admin-table">
                        <thead><tr><th class="ps-3">Họ tên / username</th><th>Email</th><th>Điện thoại</th><th>Trạng thái</th><th>Khóa đăng nhập</th><th class="text-end pe-3">Thao tác</th></tr></thead>
                        <tbody>
                        <tr th:each="account : ${accounts}">
                            <td class="ps-3"><strong th:text="${account.fullName ?: '—'}">Tên</strong><small class="d-block text-secondary" th:text="${account.username}">username</small></td>
                            <td th:text="${account.email ?: '—'}">email</td><td th:text="${account.phone ?: '—'}">phone</td>
                            <td><span class="badge" th:classappend="${account.accountStatus == 'APPROVED' ? 'text-bg-success' : (account.accountStatus == 'PENDING' or account.accountStatus == 'PENDING_APPROVAL' ? 'text-bg-warning' : (account.accountStatus == 'REJECTED' ? 'text-bg-danger' : 'text-bg-secondary'))}" th:text="${account.accountStatus}">APPROVED</span></td>
                            <td><span class="badge" th:classappend="${account.enabled ? 'text-bg-success' : 'text-bg-danger'}" th:text="${account.enabled ? 'Hoạt động' : 'Đã khóa'}">Hoạt động</span></td>
                            <td class="text-end pe-3">
                                <div class="d-inline-flex flex-wrap justify-content-end gap-1">
                                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/accounts/{category}/{id}(category=${category},id=${account.userId})}" title="Chi tiết"><i class="bi bi-eye"></i></a>
                                    <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/accounts/{category}/{id}/edit(category=${category},id=${account.userId})}" title="Sửa"><i class="bi bi-pencil"></i></a>
                                    <form method="post" th:action="@{/admin/accounts/{category}/{id}/enabled(category=${category},id=${account.userId})}">
                                        <input type="hidden" name="enabled" th:value="${!account.enabled}">
                                        <button class="btn btn-sm" th:classappend="${account.enabled ? 'btn-outline-warning' : 'btn-outline-success'}" type="submit" th:title="${account.enabled ? 'Khóa tài khoản' : 'Mở khóa tài khoản'}"><i th:class="${account.enabled ? 'bi bi-lock' : 'bi bi-unlock'}"></i></button>
                                    </form>
                                    <form method="post" th:action="@{/admin/accounts/{category}/{id}/delete(category=${category},id=${account.userId})}" onsubmit="return confirm('Xóa tài khoản này? Nếu còn dữ liệu liên quan, hệ thống sẽ từ chối để bảo toàn lịch sử.');">
                                        <button class="btn btn-sm btn-outline-danger" type="submit" title="Xóa"><i class="bi bi-trash"></i></button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(accounts)}"><td colspan="6" class="admin-empty">Không tìm thấy tài khoản phù hợp.</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
