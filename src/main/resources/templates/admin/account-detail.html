<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết tài khoản - QLPhongTro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-app"><div class="admin-layout">
    <div th:replace="~{admin/fragments :: sidebar(${activePage})}"></div>
    <main class="admin-main">
        <div th:replace="~{admin/fragments :: topbar('Chi tiết tài khoản')}"></div>
        <div class="admin-content">
            <section class="admin-panel p-4">
                <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
                    <div><h2 class="h4 fw-bold mb-1" th:text="${account.fullName ?: account.username}">Tài khoản</h2><div class="text-secondary" th:text="${account.username}">username</div></div>
                    <span class="badge fs-6" th:classappend="${account.accountStatus == 'PENDING' or account.accountStatus == 'PENDING_APPROVAL' ? 'text-bg-warning' : (account.accountStatus == 'APPROVED' ? 'text-bg-success' : (account.accountStatus == 'REJECTED' ? 'text-bg-danger' : 'text-bg-secondary'))}" th:text="${account.accountStatus}">Status</span>
                </div>
                <dl class="row mb-4">
                    <dt class="col-sm-4">Vai trò</dt><dd class="col-sm-8" th:text="${account.role.roleName}">LANDLORD</dd>
                    <dt class="col-sm-4">Email</dt><dd class="col-sm-8" th:text="${account.email ?: '—'}">—</dd>
                    <dt class="col-sm-4">Điện thoại</dt><dd class="col-sm-8" th:text="${account.phone ?: '—'}">—</dd>
                    <dt class="col-sm-4">Ngày đăng ký</dt><dd class="col-sm-8" th:text="${account.registeredAt != null ? #temporals.format(account.registeredAt, 'dd/MM/yyyy HH:mm') : 'Chưa ghi nhận'}">—</dd>
                    <dt class="col-sm-4">Đăng nhập</dt><dd class="col-sm-8" th:text="${account.enabled ? 'Được phép' : 'Đã khóa'}">—</dd>
                </dl>
                <div class="d-flex flex-wrap gap-2">
                    <a class="btn btn-outline-secondary" th:href="${activePage == 'registrations' ? '/admin/landlords/registrations' : '/admin/accounts/' + category}">Quay lại</a>
                    <a th:if="${activePage != 'registrations'} class="btn btn-primary" th:href="@{/admin/accounts/{category}/{id}/edit(category=${category},id=${account.userId})}">Chỉnh sửa</a>
                    <form th:if="${activePage == 'registrations' and account.accountStatus == 'PENDING'}" method="post" th:action="@{/admin/landlords/registrations/{id}/approve(id=${account.userId})}"><button class="btn btn-success" type="submit">Duyệt tài khoản</button></form>
                    <form th:if="${activePage == 'registrations' and account.accountStatus == 'PENDING'}" method="post" th:action="@{/admin/landlords/registrations/{id}/reject(id=${account.userId})}" onsubmit="return confirm('Từ chối yêu cầu này?');"><button class="btn btn-outline-danger" type="submit">Từ chối</button></form>
                </div>
            </section>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
