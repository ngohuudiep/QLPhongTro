<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết phòng quản lý - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-app"><div class="admin-layout">
    <div th:replace="~{admin/fragments :: sidebar('managed-rooms')}"></div>
    <main class="admin-main">
        <div th:replace="~{admin/fragments :: topbar('Chi tiết phòng quản lý')}"></div>
        <div class="admin-content"><section class="admin-panel p-4">
            <div class="d-flex justify-content-between gap-3"><div><div class="text-secondary small" th:text="${room.roomCode}">Mã phòng</div><h2 class="h4 fw-bold" th:text="${room.building.buildingName}">Khu trọ</h2></div><span class="badge fs-6 align-self-start" th:text="${room.status}">Status</span></div>
            <dl class="row mt-4">
                <dt class="col-sm-4">Địa chỉ</dt><dd class="col-sm-8" th:text="${room.building.address + (room.building.city != null ? ', ' + room.building.city : '')}">—</dd>
                <dt class="col-sm-4">Chủ sở hữu</dt><dd class="col-sm-8" th:text="${room.building.owner != null ? (room.building.owner.fullName + ' (' + room.building.owner.username + ')') : 'Chưa gán'}">—</dd>
                <dt class="col-sm-4">Tầng</dt><dd class="col-sm-8" th:text="${room.floorNo ?: '—'}">—</dd>
                <dt class="col-sm-4">Sức chứa</dt><dd class="col-sm-8" th:text="${room.maxOccupants ?: '—'}">—</dd>
                <dt class="col-sm-4">Giá riêng</dt><dd class="col-sm-8" th:text="${room.priceOverride != null ? #numbers.formatDecimal(room.priceOverride, 0, 'COMMA', 0, 'POINT') + ' ₫' : 'Theo giá khu trọ'}">—</dd>
            </dl>
            <div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/admin/managed-rooms}">Quay lại</a><a class="btn btn-primary" th:href="@{/admin/managed-rooms/{id}/edit(id=${room.roomId})}">Chỉnh sửa</a></div>
        </section></div>
    </main>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body>
</html>
