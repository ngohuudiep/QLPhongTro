<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Khu trọ quản lý - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-app"><div class="admin-layout">
    <div th:replace="~{admin/fragments :: sidebar('buildings')}"></div>
    <main class="admin-main">
        <div th:replace="~{admin/fragments :: topbar('Khu trọ quản lý')}"></div>
        <div class="admin-content">
            <div th:replace="~{admin/fragments :: alerts}"></div>
            <section class="admin-panel">
                <div class="admin-panel-heading"><div><h2>Khu trọ (Buildings)</h2><small class="text-secondary">Khu trọ đang có phòng không thể xóa.</small></div><a class="btn btn-primary btn-sm" th:href="@{/admin/buildings/new}"><i class="bi bi-plus-lg me-1"></i>Thêm khu trọ</a></div>
                <div class="table-responsive"><table class="table table-hover admin-table">
                    <thead><tr><th class="ps-3">Mã / tên khu trọ</th><th>Địa chỉ</th><th>Chủ sở hữu</th><th>Số tầng</th><th class="text-end pe-3">Thao tác</th></tr></thead>
                    <tbody>
                    <tr th:each="building : ${buildings}">
                        <td class="ps-3"><strong th:text="${building.buildingName}">Tên</strong><small class="d-block text-secondary" th:text="${building.buildingCode}">Mã</small></td>
                        <td th:text="${building.address + (building.city != null ? ', ' + building.city : '')}">Địa chỉ</td>
                        <td th:text="${building.owner != null ? (building.owner.fullName + ' (' + building.owner.username + ')') : 'Chưa gán'}">—</td>
                        <td th:text="${building.totalFloors ?: '—'}">—</td>
                        <td class="text-end pe-3"><div class="d-inline-flex gap-1">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/buildings/{id}/edit(id=${building.buildingId})}" title="Sửa"><i class="bi bi-pencil"></i></a>
                            <form method="post" th:action="@{/admin/buildings/{id}/delete(id=${building.buildingId})}" onsubmit="return confirm('Xóa khu trọ này? Chỉ khu trọ chưa có phòng mới được xóa.');"><button class="btn btn-sm btn-outline-danger" type="submit" title="Xóa"><i class="bi bi-trash"></i></button></form>
                        </div></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(buildings)}"><td colspan="5" class="admin-empty">Chưa có khu trọ trong kho Buildings/Rooms.</td></tr>
                    </tbody>
                </table></div>
            </section>
        </div>
    </main>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body>
</html>
