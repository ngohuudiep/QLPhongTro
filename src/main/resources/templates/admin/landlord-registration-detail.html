<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết đăng ký chủ trọ - QLPhongTro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-app"><div class="admin-layout">
    <div th:replace="~{admin/fragments :: sidebar('registrations')}"></div>
    <main class="admin-main">
        <div th:replace="~{admin/fragments :: topbar('Chi tiết đăng ký chủ trọ')}"></div>
        <div class="admin-content">
            <div th:replace="~{admin/fragments :: alerts}"></div>
            <section class="admin-panel p-4">
                <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
                    <div><h2 class="h4 fw-bold mb-1" th:text="${account.fullName ?: account.username}">Tài khoản</h2><div class="text-secondary" th:text="${account.username}">username</div></div>
                    <span class="badge fs-6" th:classappend="${account.accountStatus == 'APPROVED' ? 'text-bg-success' : (account.accountStatus == 'REJECTED' ? 'text-bg-danger' : 'text-bg-warning')}" th:text="${account.accountStatus}">PENDING_APPROVAL</span>
                </div>
                <dl class="row mb-4">
                    <dt class="col-sm-4">Email</dt><dd class="col-sm-8" th:text="${account.email ?: '—'}">—</dd>
                    <dt class="col-sm-4">Số điện thoại</dt><dd class="col-sm-8" th:text="${account.phone ?: '—'}">—</dd>
                    <dt class="col-sm-4">Địa chỉ</dt><dd class="col-sm-8" th:text="${account.contactAddress ?: '—'}">—</dd>
                    <dt class="col-sm-4">Ngày đăng ký</dt><dd class="col-sm-8" th:text="${account.registeredAt != null ? #temporals.format(account.registeredAt, 'dd/MM/yyyy HH:mm') : 'Chưa ghi nhận'}">—</dd>
                    <dt class="col-sm-4">Ngày phê duyệt</dt><dd class="col-sm-8" th:text="${account.approvedAt != null ? #temporals.format(account.approvedAt, 'dd/MM/yyyy HH:mm') : '—'}">—</dd>
                    <dt class="col-sm-4">Ngày từ chối</dt><dd class="col-sm-8" th:text="${account.rejectedAt != null ? #temporals.format(account.rejectedAt, 'dd/MM/yyyy HH:mm') : '—'}">—</dd>
                    <dt class="col-sm-4">Lý do từ chối</dt><dd class="col-sm-8" th:text="${account.rejectionReason ?: '—'}">—</dd>
                </dl>
                <div class="d-flex flex-wrap gap-2">
                    <a class="btn btn-outline-secondary" th:href="@{/admin/landlords/registrations}">Quay lại danh sách</a>
                    <form th:if="${account.accountStatus == 'PENDING_APPROVAL' or account.accountStatus == 'PENDING'}" method="post" th:action="@{/admin/landlords/registrations/{id}/approve(id=${account.userId})}">
                        <button class="btn btn-success" type="submit">Phê duyệt tài khoản</button>
                    </form>
                    <button th:if="${account.accountStatus == 'PENDING_APPROVAL' or account.accountStatus == 'PENDING'}" class="btn btn-outline-danger" type="button" data-bs-toggle="collapse" data-bs-target="#rejectForm" aria-expanded="false">Từ chối</button>
                </div>
                <form th:if="${account.accountStatus == 'PENDING_APPROVAL' or account.accountStatus == 'PENDING'}" id="rejectForm" class="collapse mt-3" method="post" th:action="@{/admin/landlords/registrations/{id}/reject(id=${account.userId})}">
                    <label class="form-label fw-semibold" for="reason">Lý do từ chối</label>
                    <textarea class="form-control mb-2" id="reason" name="reason" maxlength="1000" rows="4" required></textarea>
                    <button class="btn btn-danger" type="submit">Xác nhận từ chối</button>
                </form>
            </section>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
