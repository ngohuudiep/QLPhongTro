<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="vi">
<body>
<aside th:fragment="sidebar(activePage)" class="admin-sidebar" id="adminSidebar">
    <a class="admin-brand" th:href="@{/admin/dashboard}">
        <span class="admin-brand-icon"><i class="bi bi-buildings"></i></span>
        <span>QLPhongTro<small>TRUNG TÂM QUẢN TRỊ</small></span>
    </a>
    <div class="admin-nav-label">Tổng quan</div>
    <nav class="admin-nav" aria-label="Điều hướng quản trị">
        <a th:href="@{/admin/dashboard}" th:classappend="${activePage == 'dashboard' ? ' active' : ''}"><i class="bi bi-grid-1x2"></i> Dashboard</a>
        <a th:href="@{/admin/landlords/registrations}" th:classappend="${activePage == 'registrations' ? ' active' : ''}">
            <i class="bi bi-person-check"></i> Duyệt tài khoản chủ trọ
            <span th:if="${pendingCount != null and pendingCount > 0}" class="badge rounded-pill bg-warning text-dark" th:text="${pendingCount}">0</span>
        </a>
    </nav>
    <div class="admin-nav-label">Quản lý hệ thống</div>
    <nav class="admin-nav">
        <a th:href="@{/admin/accounts/landlords}" th:classappend="${activePage == 'landlords' ? ' active' : ''}"><i class="bi bi-house-gear"></i> Tài khoản chủ trọ</a>
        <a th:href="@{/admin/accounts/tenants}" th:classappend="${activePage == 'tenants' ? ' active' : ''}"><i class="bi bi-people"></i> Tài khoản người thuê</a>
        <a th:href="@{/admin/reviews}" th:classappend="${activePage == 'reviews' ? ' active' : ''}"><i class="bi bi-shield-check"></i> Kiểm duyệt đánh giá</a>
        <a th:href="@{/admin/rooms}" th:classappend="${activePage == 'rooms' ? ' active' : ''}"><i class="bi bi-door-open"></i> Bài đăng phòng</a>
        <a th:href="@{/admin/buildings}" th:classappend="${activePage == 'buildings' ? ' active' : ''}"><i class="bi bi-buildings"></i> Khu trọ quản lý</a>
        <a th:href="@{/admin/managed-rooms}" th:classappend="${activePage == 'managed-rooms' ? ' active' : ''}"><i class="bi bi-key"></i> Phòng quản lý</a>
    </nav>
    <div class="admin-sidebar-footer"><i class="bi bi-shield-check me-1"></i> Khu vực quản trị bảo mật</div>
</aside>

<header th:fragment="topbar(title)" class="admin-topbar">
    <div class="d-flex align-items-center gap-3">
        <button class="btn btn-outline-secondary admin-mobile-menu" type="button" aria-label="Mở menu"
                onclick="document.getElementById('adminSidebar').classList.toggle('show')"><i class="bi bi-list"></i></button>
        <div><div class="admin-eyebrow">HỆ THỐNG QUẢN LÝ PHÒNG TRỌ</div><h1 th:text="${title}">Quản trị</h1></div>
    </div>
    <div class="d-flex align-items-center gap-3">
        <a class="btn btn-light position-relative" th:href="@{/admin/landlords/registrations}" title="Yêu cầu chờ duyệt">
            <i class="bi bi-bell"></i>
            <span th:if="${pendingCount != null and pendingCount > 0}" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" th:text="${pendingCount}">0</span>
        </a>
        <div class="admin-user"><span class="admin-avatar"><i class="bi bi-person-gear"></i></span><span class="d-none d-sm-inline" sec:authentication="name">Admin</span></div>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right me-sm-1"></i><span class="d-none d-sm-inline">Đăng xuất</span></button>
        </form>
    </div>
</header>

<div th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>
<script th:fragment="scripts" th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
