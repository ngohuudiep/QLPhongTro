<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${isEdit ? 'Cập nhật phòng' : 'Thêm phòng'} + ' - QLPhongTro'">Phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-app"><div class="admin-layout">
    <div th:replace="~{admin/fragments :: sidebar('rooms')}"></div>
    <main class="admin-main">
        <div th:replace="~{admin/fragments :: topbar(${isEdit ? 'Cập nhật bài đăng phòng' : 'Thêm bài đăng phòng'})}"></div>
        <div class="admin-content">
            <div th:replace="~{admin/fragments :: alerts}"></div>
            <section class="admin-panel p-3 p-md-4">
                <form th:action="@{/admin/rooms/save}" th:object="${room}" method="post" class="row g-3">
                    <input type="hidden" th:field="*{listingId}">
                    <div class="col-md-4"><label class="form-label">Mã phòng *</label><input class="form-control" th:field="*{roomCode}" maxlength="20" required><div class="text-danger small" th:if="${#fields.hasErrors('roomCode')}" th:errors="*{roomCode}"></div></div>
                    <div class="col-md-8"><label class="form-label">Tên / tiêu đề phòng *</label><input class="form-control" th:field="*{title}" maxlength="255" required><div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div></div>
                    <div class="col-md-6"><label class="form-label">Chủ trọ sở hữu</label><select class="form-select" name="ownerId"><option value="">Chưa gán chủ trọ</option><option th:each="owner : ${owners}" th:value="${owner.userId}" th:selected="${room.createdBy != null and room.createdBy.userId == owner.userId}" th:text="${owner.fullName + ' (' + owner.username + ')'}"></option></select></div>
                    <div class="col-md-3"><label class="form-label">Giá thuê (VNĐ) *</label><input class="form-control" type="number" th:field="*{price}" min="100000" step="1000" required><div class="text-danger small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div></div>
                    <div class="col-md-3"><label class="form-label">Diện tích (m²) *</label><input class="form-control" type="number" th:field="*{area}" min="5" step="0.1" required><div class="text-danger small" th:if="${#fields.hasErrors('area')}" th:errors="*{area}"></div></div>
                    <div class="col-md-3"><label class="form-label">Tầng</label><input class="form-control" type="number" th:field="*{floorNo}" min="0"></div>
                    <div class="col-md-3"><label class="form-label">Trạng thái</label><select class="form-select" th:field="*{status}"><option value="TRONG">Còn trống</option><option value="DA_THUE">Đang thuê</option><option value="BAO_TRI">Bảo trì</option></select></div>
                    <div class="col-md-6"><label class="form-label">URL ảnh</label><input class="form-control" type="url" th:field="*{imageUrl}" maxlength="500"></div>
                    <div class="col-12"><label class="form-label">Mô tả</label><textarea class="form-control" th:field="*{description}" rows="4"></textarea></div>
                    <div class="col-12"><label class="form-label">Tiện nghi</label><input class="form-control" th:field="*{amenities}" maxlength="500"></div>
                    <div class="col-md-6"><label class="form-label">Người thuê hiện tại (nếu có)</label><input class="form-control" th:field="*{currentTenant}" maxlength="150"></div>
                    <div class="col-md-6"><label class="form-label">Điện thoại người thuê</label><input class="form-control" th:field="*{tenantPhone}" maxlength="20"></div>
                    <div class="col-12 d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" th:href="@{/admin/rooms}">Hủy</a><button class="btn btn-primary" type="submit"><i class="bi bi-check2 me-1"></i>Lưu phòng</button></div>
                </form>
            </section>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
