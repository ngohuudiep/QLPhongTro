<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <h1 class="h3 mb-3">Quản lý tài khoản</h1>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <a class="btn btn-primary mb-3" th:href="@{/admin/users/new}">Tạo tài khoản ADMIN/STAFF</a>
    <div class="table-responsive bg-white">
        <table class="table table-striped align-middle mb-0">
            <thead><tr><th>Tên đăng nhập</th><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
            <tbody>
            <tr th:each="account : ${users}">
                <td th:text="${account.username}"></td>
                <td th:text="${account.fullName}"></td>
                <td th:text="${account.email}"></td>
                <td th:text="${account.role.roleName}"></td>
                <td th:text="${account.accountEnabled ? 'Đang hoạt động' : 'Đã khóa'}"></td>
                <td class="d-flex gap-2">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/users/edit/{id}(id=${account.userId})}">Sửa</a>
                    <form method="post" th:action="@{/admin/users/{id}/enabled(id=${account.userId})}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="enabled" th:value="${!account.accountEnabled}">
                        <button class="btn btn-sm" th:classappend="${account.accountEnabled ? 'btn-outline-danger' : 'btn-outline-success'}"
                                th:text="${account.accountEnabled ? 'Khóa' : 'Mở khóa'}"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
