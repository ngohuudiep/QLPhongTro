<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách phòng</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h4 class="card-title mb-0 fw-bold text-primary">
                <i class="bi bi-door-open me-2"></i>Danh sách phòng
            </h4>
            <!-- Nút Thêm mới gắn link Thymeleaf -->
            <a th:href="@{/rooms/new}" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Thêm mới
            </a>
        </div>
        
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-primary text-nowrap">
                        <tr>
                            <th class="text-center" style="width: 80px;">ID</th>
                            <th>Mã phòng</th>
                            <th>Tầng</th>
                            <th>Sức chứa</th>
                            <th>Trạng thái</th>
                            <th class="text-center" style="width: 180px;">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Lặp danh sách phòng từ controller -->
                        <tr th:each="room : ${rooms}">
                            <td class="text-center fw-bold" th:text="${room.roomId != null ? room.roomId : room.id}">1</td>
                            <td class="fw-semibold text-primary" th:text="${room.roomCode}">P.101</td>
                            <td th:text="${room.floorNo != null ? 'Tầng ' + room.floorNo : '—'}">Tầng 1</td>
                            <td th:text="${room.maxOccupants != null ? room.maxOccupants + ' người' : '—'}">2 người</td>
                            <td>
                                <!-- Trạng thái: Trống, Đang thuê, Bảo trì -->
                                <span th:if="${room.status == 'Trống'}" class="badge bg-success">Trống</span>
                                <span th:if="${room.status == 'Đang thuê'}" class="badge bg-primary">Đang thuê</span>
                                <span th:if="${room.status == 'Bảo trì'}" class="badge bg-warning text-dark">Bảo trì</span>
                                <span th:if="${room.status != 'Trống' and room.status != 'Đang thuê' and room.status != 'Bảo trì'}" 
                                      class="badge bg-secondary" th:text="${room.status}">Khác</span>
                            </td>
                            <td class="text-center">
                                <!-- Nút Sửa gắn link chuẩn Thymeleaf -->
                                <a th:href="@{/rooms/edit/{id}(id=${room.roomId != null ? room.roomId : room.id})}" 
                                   class="btn btn-sm btn-outline-primary me-1">
                                    <i class="bi bi-pencil-square"></i> Sửa
                                </a>
                                <!-- Nút Xóa gắn link chuẩn Thymeleaf -->
                                <a th:href="@{/rooms/delete/{id}(id=${room.roomId != null ? room.roomId : room.id})}" 
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa phòng này không?');">
                                    <i class="bi bi-trash"></i> Xóa
                                </a>
                            </td>
                        </tr>

                        <!-- Thông báo khi danh sách rỗng -->
                        <tr th:if="${#lists.isEmpty(rooms)}">
                            <td colspan="6" class="text-center py-4 text-muted">
                                Không có phòng nào trong danh sách.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
