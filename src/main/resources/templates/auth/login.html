<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống – QLPhongTro</title>
    <!-- Fonts & Bootstrap 5 với subset=vietnamese -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&subset=vietnamese&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navbar Fragment -->
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="d-flex align-items-center justify-content-center py-5 flex-grow-1">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5 col-xl-4">
                    
                    <!-- Login Card -->
                    <div class="card-modern p-4 p-sm-5">
                        <div class="text-center mb-4">
                            <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                                <i class="bi bi-shield-lock"></i>
                            </div>
                            <h3 class="fw-bold mb-1">Đăng nhập</h3>
                            <p class="text-muted small">Chào mừng bạn quay trở lại với QLPhongTro</p>
                        </div>

                        <!-- Alerts -->
                        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center py-2 px-3 mb-4 rounded-3" role="alert">
                            <i class="bi bi-exclamation-circle-fill me-2 fs-5"></i>
                            <div class="small fw-medium" th:text="${errorMessage}"></div>
                        </div>

                        <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center py-2 px-3 mb-4 rounded-3" role="alert">
                            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                            <div class="small fw-medium" th:text="${successMessage}"></div>
                        </div>

                        <!-- Form -->
                        <form th:action="@{/login}" method="post">
                            <!-- Email / Phone / Username -->
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold small">Email, Số điện thoại hoặc Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="username" name="username" placeholder="Nhập email, SĐT hoặc tên tài khoản" required autofocus>
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="password" class="form-label fw-semibold small mb-0">Mật khẩu</label>
                                    <a th:href="@{/forgot-password}" class="text-decoration-none small text-primary fw-medium">Quên mật khẩu?</a>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu của bạn" required>
                                    <button class="btn btn-outline-secondary border" type="button" onclick="togglePasswordVisibility('password', this)">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Remember Me Checkbox -->
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                                <label class="form-check-label small text-muted user-select-none" for="remember-me">
                                    Ghi nhớ đăng nhập trên thiết bị này
                                </label>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                                <i class="bi bi-box-arrow-in-right"></i> Đăng nhập ngay
                            </button>

                            <!-- Demo Accounts Note -->
                            <div class="p-3 bg-light border rounded-3 mb-4 text-muted small">
                                <div class="fw-bold mb-1 text-dark"><i class="bi bi-info-circle me-1 text-primary"></i> Tài khoản Demo sẵn có:</div>
                                <div>- <strong>Chủ trọ (Admin):</strong> <code>admin</code> / <code>123456</code></div>
                                <div>- <strong>Người thuê (User):</strong> <code>user01</code> / <code>123456</code></div>
                            </div>

                            <div class="text-center small text-muted">
                                Chưa có tài khoản?
                                <a th:href="@{/register}" class="text-primary fw-bold text-decoration-none">Đăng ký tài khoản mới</a>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{layout/footer :: footer}"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
