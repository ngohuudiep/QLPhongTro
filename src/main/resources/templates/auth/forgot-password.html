<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi phục mật khẩu – QLPhongTro</title>
    <!-- Fonts & Bootstrap 5 với subset=vietnamese -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&subset=vietnamese&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navbar Fragment -->
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="d-flex align-items-center justify-content-center py-5 flex-grow-1">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5 col-xl-4">
                    
                    <div class="card-modern p-4 p-sm-5">
                        <div class="text-center mb-4">
                            <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                                <i class="bi bi-key-fill"></i>
                            </div>
                            <h3 class="fw-bold mb-1">Quên mật khẩu?</h3>
                            <p class="text-muted small">Khôi phục mật khẩu nhanh chóng qua mã xác thực OTP</p>
                        </div>

                        <!-- Alerts -->
                        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center py-2 px-3 mb-4 rounded-3" role="alert">
                            <i class="bi bi-exclamation-circle-fill me-2 fs-5"></i>
                            <div class="small fw-medium" th:text="${errorMessage}"></div>
                        </div>

                        <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center py-2 px-3 mb-4 rounded-3" role="alert">
                            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                            <div class="small fw-medium" th:text="${successMessage}"></div>
                        </div>

                        <!-- BƯỚC 1: Nhập Email hoặc SĐT -->
                        <form th:if="${step == 1}" th:action="@{/forgot-password/send-otp}" th:object="${forgotDto}" method="post">
                            <div class="mb-4">
                                <label for="identifier" class="form-label fw-semibold small">Nhập Email hoặc Số điện thoại của bạn</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope-at"></i></span>
                                    <input type="text" class="form-control" th:field="*{identifier}" id="identifier" placeholder="Email hoặc SĐT đăng ký" required autofocus>
                                </div>
                                <div class="form-text text-muted" style="font-size: 0.75rem;">
                                    Hệ thống sẽ tạo mã OTP xác nhận gửi đến bạn.
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                                <i class="bi bi-send"></i> Gửi mã xác thực OTP
                            </button>

                            <div class="text-center small text-muted">
                                <a th:href="@{/login}" class="text-decoration-none text-muted">
                                    <i class="bi bi-arrow-left me-1"></i> Quay lại Đăng nhập
                                </a>
                            </div>
                        </form>

                        <!-- BƯỚC 2: Nhập OTP và Mật khẩu mới -->
                        <form th:if="${step == 2}" th:action="@{/forgot-password/reset}" th:object="${forgotDto}" method="post">
                            <input type="hidden" th:field="*{identifier}">

                            <div class="mb-3">
                                <label for="otp" class="form-label fw-semibold small">Mã xác thực OTP (6 chữ số)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                                    <input type="text" class="form-control text-center fw-bold fs-5 letter-spacing-1" th:field="*{otp}" id="otp" maxlength="6" placeholder="000000" required autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="newPassword" class="form-label fw-semibold small">Mật khẩu mới</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" th:field="*{newPassword}" id="newPassword" placeholder="Tối thiểu 8 ký tự, có chữ và số" required minlength="8">
                                    <button class="btn btn-outline-secondary border" type="button" onclick="togglePasswordVisibility('newPassword', this)">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                                <i class="bi bi-check-circle"></i> Đặt lại mật khẩu & Đăng nhập
                            </button>

                            <div class="text-center small text-muted">
                                <a th:href="@{/forgot-password}" class="text-decoration-none text-muted">
                                    <i class="bi bi-arrow-repeat me-1"></i> Nhập lại Email/SĐT khác
                                </a>
                            </div>
                        </form>

                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{layout/footer :: footer}"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
