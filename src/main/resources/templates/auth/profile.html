<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân – QLPhongTro</title>
    <!-- Fonts & Bootstrap 5 với subset=vietnamese -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&subset=vietnamese&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navbar Fragment -->
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="py-5 flex-grow-1">
        <div class="container">
            
            <div class="row g-4">
                <!-- User Summary Sidebar Card -->
                <div class="col-lg-4">
                    <div class="card-modern p-4 text-center">
                        <div class="rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center fw-bold shadow-sm"
                             style="width: 80px; height: 80px; font-size: 2rem; background: linear-gradient(135deg, var(--teal-500) 0%, var(--teal-700) 100%); color: #fff;">
                            <span th:text="${user.fullName != null && !user.fullName.isEmpty() ? #strings.substring(user.fullName, 0, 1).toUpperCase() : 'U'}">U</span>
                        </div>
                        <h4 class="fw-bold mb-1" th:text="${user.fullName != null ? user.fullName : user.username}">Nguyễn Văn An</h4>
                        <p class="text-muted small mb-2">@<span th:text="${user.username}">username</span></p>

                        <div class="mb-4">
                            <span class="badge-status badge-status-empty py-1 px-3">
                                <i class="bi bi-shield-check"></i>
                                <span th:if="${user.role.roleName == 'ADMIN'}">Chủ trọ (Quản trị viên)</span>
                                <span th:if="${user.role.roleName == 'STAFF'}">Nhân viên vận hành</span>
                                <span th:if="${user.role.roleName == 'USER'}">Người thuê phòng</span>
                            </span>
                        </div>

                        <ul class="list-group list-group-flush text-start small border-top pt-3">
                            <li class="list-group-item bg-transparent d-flex justify-content-between px-0 py-2">
                                <span class="text-muted"><i class="bi bi-envelope me-2"></i>Email:</span>
                                <strong th:text="${user.email != null ? user.email : 'Chưa cập nhật'}">user@example.com</strong>
                            </li>
                            <li class="list-group-item bg-transparent d-flex justify-content-between px-0 py-2">
                                <span class="text-muted"><i class="bi bi-telephone me-2"></i>Số điện thoại:</span>
                                <strong th:text="${user.phone != null ? user.phone : 'Chưa cập nhật'}">0901234567</strong>
                            </li>
                            <li class="list-group-item bg-transparent d-flex justify-content-between px-0 py-2">
                                <span class="text-muted"><i class="bi bi-key me-2"></i>Bảo mật:</span>
                                <span class="badge bg-success-subtle text-success border border-success-subtle">BCrypt An toàn</span>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Main Content Tabs / Forms -->
                <div class="col-lg-8">
                    <!-- Flash Messages -->
                    <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center py-2 px-3 mb-4 rounded-3" role="alert">
                        <i class="bi bi-exclamation-circle-fill me-2 fs-5"></i>
                        <div class="small fw-medium" th:text="${errorMessage}"></div>
                    </div>

                    <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center py-2 px-3 mb-4 rounded-3" role="alert">
                        <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                        <div class="small fw-medium" th:text="${successMessage}"></div>
                    </div>

                    <!-- Card 1: Cập nhật thông tin cá nhân -->
                    <div class="card-modern p-4 mb-4">
                        <div class="d-flex align-items-center gap-2 mb-3 pb-2 border-bottom">
                            <i class="bi bi-person-gear text-primary fs-4"></i>
                            <h5 class="fw-bold mb-0">Cập nhật thông tin cá nhân</h5>
                        </div>

                        <form th:action="@{/profile/update}" th:object="${updateDto}" method="post">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label for="profFullName" class="form-label fw-semibold small">Họ và tên</label>
                                    <input type="text" class="form-control" th:field="*{fullName}" id="profFullName" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="profEmail" class="form-label fw-semibold small">Email</label>
                                    <input type="email" class="form-control" th:field="*{email}" id="profEmail" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="profPhone" class="form-label fw-semibold small">Số điện thoại</label>
                                    <input type="tel" class="form-control" th:field="*{phone}" id="profPhone" required>
                                </div>
                            </div>

                            <div class="text-end mt-4">
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-floppy"></i> Lưu thay đổi
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Card 2: Đổi mật khẩu -->
                    <div class="card-modern p-4" id="change-password">
                        <div class="d-flex align-items-center gap-2 mb-3 pb-2 border-bottom">
                            <i class="bi bi-shield-lock text-warning fs-4"></i>
                            <h5 class="fw-bold mb-0">Đổi mật khẩu tài khoản</h5>
                        </div>

                        <form th:action="@{/profile/change-password}" th:object="${changePassDto}" method="post">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label for="currPass" class="form-label fw-semibold small">Mật khẩu hiện tại</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" th:field="*{currentPassword}" id="currPass" required>
                                        <button class="btn btn-outline-secondary border" type="button" onclick="togglePasswordVisibility('currPass', this)">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="newPass" class="form-label fw-semibold small">Mật khẩu mới</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" th:field="*{newPassword}" id="newPass" required minlength="8" oninput="checkPasswordStrength(this.value, 'profPassFill', 'profPassLabel')">
                                        <button class="btn btn-outline-secondary border" type="button" onclick="togglePasswordVisibility('newPass', this)">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                    <div class="password-meter-bar">
                                        <div id="profPassFill" class="password-meter-fill"></div>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center mt-1">
                                        <span class="text-muted" style="font-size: 0.72rem;">Tối thiểu 8 ký tự, có chữ và số</span>
                                        <span id="profPassLabel" class="fw-bold" style="font-size: 0.72rem;"></span>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="confNewPass" class="form-label fw-semibold small">Xác nhận mật khẩu mới</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" th:field="*{confirmPassword}" id="confNewPass" required>
                                        <button class="btn btn-outline-secondary border" type="button" onclick="togglePasswordVisibility('confNewPass', this)">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="text-end mt-4">
                                <button type="submit" class="btn btn-outline-primary px-4">
                                    <i class="bi bi-key"></i> Đổi mật khẩu
                                </button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{layout/footer :: footer}"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
