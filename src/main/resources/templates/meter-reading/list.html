<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý chỉ số điện / nước - Quản lý phòng trọ</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <!-- Thông báo kết quả Flash Message -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm mb-4" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}">Thao tác thành công!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h4 class="card-title mb-0 fw-bold text-primary">
                <i class="bi bi-speedometer2 me-2"></i>Chốt chỉ số điện & nước (Meter Readings)
            </h4>
            <!-- Nút chốt chỉ số mới -->
            <a th:href="@{/meter-readings/new}" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Chốt chỉ số mới
            </a>
        </div>
        
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-primary text-nowrap">
                        <tr>
                            <th class="text-center" style="width: 70px;">ID</th>
                            <th>Phòng</th>
                            <th>Kỳ chốt số (Tháng)</th>
                            <th class="text-end">Chỉ số đầu</th>
                            <th class="text-end">Chỉ số cuối</th>
                            <th class="text-end text-primary">Tiêu thụ</th>
                            <th class="text-center">Ngày ghi</th>
                            <th class="text-center" style="width: 170px;">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Lặp danh sách chỉ số -->
                        <tr th:each="r : ${readings}">
                            <td class="text-center fw-bold text-secondary" th:text="${r.readingId}">1</td>
                            <td>
                                <span class="fw-bold text-dark" th:text="${r.room != null ? r.room.roomCode : '—'}">P.101</span>
                                <small class="text-muted d-block" 
                                       th:text="${r.room != null and r.room.building != null ? r.room.building.buildingName : ''}"></small>
                            </td>
                            <td>
                                <span class="badge bg-info-subtle text-info-emphasis border border-info-subtle" 
                                      th:text="${#temporals.format(r.billingMonth, 'MM/yyyy')}">10/2026</span>
                            </td>
                            <td class="text-end font-monospace" th:text="${#numbers.formatDecimal(r.startIndex, 1, 'COMMA', 2, 'POINT')}">120.00</td>
                            <td class="text-end font-monospace" th:text="${#numbers.formatDecimal(r.endIndex, 1, 'COMMA', 2, 'POINT')}">150.00</td>
                            <td class="text-end font-monospace fw-bold text-success fs-6">
                                <span th:text="${#numbers.formatDecimal(r.consumption, 1, 'COMMA', 2, 'POINT')}">30.00</span>
                            </td>
                            <td class="text-center" th:text="${#temporals.format(r.readDate, 'dd/MM/yyyy')}">14/10/2026</td>
                            <td class="text-center">
                                <a th:href="@{/meter-readings/edit/{id}(id=${r.readingId})}" 
                                   class="btn btn-sm btn-outline-primary me-1" title="Sửa">
                                    <i class="bi bi-pencil-square"></i> Sửa
                                </a>
                                <a th:href="@{/meter-readings/delete/{id}(id=${r.readingId})}" 
                                   class="btn btn-sm btn-outline-danger" title="Xóa"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa bản ghi chỉ số này không?');">
                                    <i class="bi bi-trash"></i> Xóa
                                </a>
                            </td>
                        </tr>

                        <!-- Thông báo khi rỗng -->
                        <tr th:if="${#lists.isEmpty(readings)}">
                            <td colspan="8" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2 text-secondary"></i>
                                Chưa có bản ghi chốt số nào.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
