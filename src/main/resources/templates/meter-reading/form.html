<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${reading.readingId != null ? 'Cập nhật chỉ số' : 'Chốt chỉ số mới'} + ' - Quản lý phòng trọ'">Chốt chỉ số</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <!-- Thông báo lỗi nếu có -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h4 class="card-title mb-0 fw-bold text-primary" 
                        th:text="${reading.readingId != null ? 'Chỉnh sửa chỉ số điện/nước' : 'Ghi nhận / Chốt chỉ số mới'}">
                        Chốt chỉ số
                    </h4>
                </div>
                
                <div class="card-body p-4">
                    <!-- Form nhập liệu -->
                    <form th:action="@{/meter-readings/save}" th:object="${reading}" method="post" id="meterForm">
                        <!-- Trường ID ẩn (dùng khi cập nhật) -->
                        <input type="hidden" th:field="*{readingId}" />

                        <div class="row g-3">
                            <!-- 1. Chọn Phòng (Dropdown) -->
                            <div class="col-md-6">
                                <label for="room" class="form-label fw-semibold">Phòng <span class="text-danger">*</span></label>
                                <select class="form-select" id="room" th:field="*{room}" required>
                                    <option value="" disabled selected>-- Chọn phòng trọ --</option>
                                    <option th:each="r : ${rooms}" 
                                            th:value="${r.roomId}" 
                                            th:text="${r.roomCode + ' - ' + (r.building != null ? r.building.buildingName : 'Không rõ tòa')}">
                                        P.101 - Tòa A
                                    </option>
                                </select>
                            </div>

                            <!-- 2. Kỳ chốt số (billing_month) -->
                            <div class="col-md-6">
                                <label for="billingMonth" class="form-label fw-semibold">Kỳ chốt số (Tháng) <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="billingMonth" th:field="*{billingMonth}" required>
                                <div class="form-text">Chọn tháng áp dụng hóa đơn (Ví dụ: 01/10/2026).</div>
                            </div>

                            <!-- 3. Chỉ số đầu (start_index) -->
                            <div class="col-md-6">
                                <label for="startIndex" class="form-label fw-semibold">Chỉ số đầu (Start Index) <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" min="0" class="form-control" 
                                       id="startIndex" th:field="*{startIndex}" 
                                       placeholder="Ví dụ: 120.00" required oninput="calculateConsumptionPreview()">
                            </div>

                            <!-- 4. Chỉ số cuối (end_index) -->
                            <div class="col-md-6">
                                <label for="endIndex" class="form-label fw-semibold">Chỉ số cuối (End Index) <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" min="0" class="form-control" 
                                       id="endIndex" th:field="*{endIndex}" 
                                       placeholder="Ví dụ: 150.00" required oninput="calculateConsumptionPreview()">
                            </div>

                            <!-- 5. Ngày ghi nhận (read_date) -->
                            <div class="col-md-6">
                                <label for="readDate" class="form-label fw-semibold">Ngày chốt số <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="readDate" th:field="*{readDate}" required>
                            </div>

                            <!-- 6. Xem trước sản lượng tiêu thụ (Preview Consumption) -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-success">
                                    <i class="bi bi-calculator me-1"></i>Sản lượng tiêu thụ (Tự động tính)
                                </label>
                                <div class="input-group">
                                    <input type="text" class="form-control bg-success-subtle text-success fw-bold fs-5" 
                                           id="previewConsumption" 
                                           th:value="${reading.consumption != null ? reading.consumption : '0.00'}" 
                                           readonly>
                                    <span class="input-group-text bg-success text-white">kWh / m³</span>
                                </div>
                                <div class="form-text text-muted">
                                    * Công thức: <code>Consumption = End Index - Start Index</code> (Controller sẽ tự động tính lại trước khi lưu).
                                </div>
                            </div>
                        </div>

                        <!-- Nút thao tác -->
                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/meter-readings}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Quay lại
                            </a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-circle me-1"></i> Lưu chỉ số
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript tự động tính preview ngay khi người dùng gõ phím -->
<script>
function calculateConsumptionPreview() {
    const startVal = parseFloat(document.getElementById('startIndex').value) || 0;
    const endVal = parseFloat(document.getElementById('endIndex').value) || 0;
    const previewInput = document.getElementById('previewConsumption');
    
    if (endVal >= startVal) {
        const consumption = (endVal - startVal).toFixed(2);
        previewInput.value = consumption;
        previewInput.classList.remove('text-danger', 'bg-danger-subtle');
        previewInput.classList.add('text-success', 'bg-success-subtle');
    } else {
        previewInput.value = "Chỉ số cuối < đầu!";
        previewInput.classList.remove('text-success', 'bg-success-subtle');
        previewInput.classList.add('text-danger', 'bg-danger-subtle');
    }
}
// Chạy hàm tính toán ngay khi load trang (nếu là trang edit đã có sẵn số)
document.addEventListener("DOMContentLoaded", calculateConsumptionPreview);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
