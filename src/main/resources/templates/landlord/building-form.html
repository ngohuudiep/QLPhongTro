<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Khu trọ - QLPhongTro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/landlord.css}">
</head>
<body class="landlord-app"><div class="landlord-layout">
    <div th:replace="~{landlord/fragments :: sidebar(${activePage})}"></div>
    <main class="landlord-main">
        <div th:replace="~{landlord/fragments :: topbar(${building.buildingId == null ? 'Thêm khu trọ' : 'Cập nhật khu trọ'})}"></div>
        <div th:replace="~{landlord/fragments :: alerts}"></div>
        <form class="landlord-form-card" th:action="@{/landlord/buildings/save}" th:object="${building}" method="post">
            <input type="hidden" th:field="*{buildingId}">
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Mã khu trọ *</label><input class="form-control" th:field="*{buildingCode}" maxlength="20" required></div>
                <div class="col-md-6"><label class="form-label">Tên khu trọ *</label><input class="form-control" th:field="*{buildingName}" maxlength="150" required></div>
                <div class="col-12"><label class="form-label">Địa chỉ *</label><input class="form-control" th:field="*{address}" maxlength="255" required></div>
                <div class="col-md-8"><label class="form-label">Thành phố</label><input class="form-control" th:field="*{city}" maxlength="100"></div>
                <div class="col-md-4"><label class="form-label">Số tầng</label><input class="form-control" type="number" th:field="*{totalFloors}" min="1"></div>
                <div class="col-md-6"><label class="form-label">Điện thoại liên hệ</label><input class="form-control" th:field="*{contactPhone}" maxlength="20"></div>
                <div class="col-12"><label class="form-label">Mô tả</label><textarea class="form-control" th:field="*{description}" rows="4"></textarea></div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <a class="btn btn-light" th:href="@{/landlord/buildings}">Hủy</a>
                <button class="btn btn-primary" type="submit">Lưu khu trọ</button>
            </div>
        </form>
    </main>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body>
</html>
