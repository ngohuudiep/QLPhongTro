<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông tin phòng - QLPhongTro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/landlord.css}">
</head>
<body class="landlord-app"><div class="landlord-layout">
    <div th:replace="~{landlord/fragments :: sidebar(${activePage})}"></div>
    <main class="landlord-main">
        <div th:replace="~{landlord/fragments :: topbar(${room.roomId == null ? 'Thêm phòng' : 'Cập nhật phòng'})}"></div>
        <div th:replace="~{landlord/fragments :: alerts}"></div>
        <form id="roomForm" class="landlord-form-card" th:action="@{/landlord/rooms/save}" th:object="${room}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{roomId}">
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Mã phòng *</label><input class="form-control" th:field="*{roomCode}" maxlength="20" required></div>
                <div class="col-md-5"><label class="form-label">Khu trọ *</label>
                    <input id="buildingSearch" class="form-control mb-2" type="search" placeholder="Tìm theo tên hoặc địa chỉ khu trọ" aria-label="Tìm khu trọ">
                    <select id="buildingSelect" class="form-select" name="buildingId" required>
                        <option value="">Chọn khu trọ</option>
                        <option th:each="building : ${buildings}" th:value="${building.buildingId}" th:text="${building.buildingName + ' — ' + building.address}" th:selected="${room.building != null and room.building.buildingId == building.buildingId}"></option>
                    </select>
                </div>
                <div class="col-md-1 d-flex align-items-end"><button class="btn btn-outline-primary w-100" type="button" data-bs-toggle="modal" data-bs-target="#buildingModal" aria-label="Thêm khu trọ"><i class="bi bi-plus-lg"></i></button></div>
                <div class="col-md-4"><label class="form-label">Tầng</label><input class="form-control" type="number" th:field="*{floorNo}" min="0"></div>
                <div class="col-md-4"><label class="form-label">Sức chứa</label><input class="form-control" type="number" th:field="*{maxOccupants}" min="1"></div>
                <div class="col-md-4"><label class="form-label">Giá thuê tháng (VNĐ) *</label><input class="form-control" type="number" th:field="*{priceOverride}" min="100000" step="1000" required></div>
                <div class="col-md-6"><label class="form-label">Trạng thái *</label>
                    <select class="form-select" th:field="*{status}" required>
                        <option value="TRONG">Còn trống</option><option value="DA_THUE">Đang thuê</option><option value="BAO_TRI">Bảo trì</option>
                    </select>
                </div>
                <div class="col-12"><hr><h2 class="h6">Thông tin hiển thị và tìm thuê</h2></div>
                <div class="col-12"><label class="form-label">Tiêu đề *</label><input class="form-control" name="title" th:value="${listing.title}" maxlength="255" required></div>
                <div class="col-md-4"><label class="form-label">Diện tích (m²) *</label><input class="form-control" type="number" name="area" th:value="${listing.area}" min="5" step="0.1" required></div>
                <div class="col-md-8"><label class="form-label">Tiện nghi</label><input class="form-control" name="amenities" th:value="${listing.amenities}" maxlength="500" placeholder="Wifi, máy lạnh, nóng lạnh"></div>
                <div class="col-12"><label class="form-label">Mô tả phòng</label><textarea class="form-control" name="description" rows="4" th:text="${listing.description}"></textarea></div>
                <div class="col-12">
                    <label class="form-label">Ảnh phòng (JPG, PNG, WEBP; tối đa 5 MB/ảnh, 5 ảnh/phòng)</label>
                    <input id="roomImages" class="form-control" type="file" name="images" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" multiple>
                    <div class="form-text">Ảnh tải lên được lưu ngoài thư mục mã nguồn. Bỏ chọn ảnh cũ để gỡ; chọn một ảnh làm ảnh đại diện.</div>
                </div>
                <div class="col-12">
                    <div id="existingImages" class="row g-3">
                        <div class="col-6 col-md-3" th:each="url : ${listing.galleryList}" th:if="${url != '/images/room-placeholder.svg'}">
                            <div class="border rounded p-2 h-100">
                                <img class="img-fluid rounded mb-2" style="height:130px;width:100%;object-fit:cover" th:src="${url}" alt="Ảnh phòng hiện có">
                                <label class="form-check small"><input class="form-check-input" type="checkbox" name="retainedImageUrls" th:value="${url}" checked> Giữ ảnh</label>
                                <label class="form-check small"><input class="form-check-input" type="radio" name="primaryImageUrl" th:value="${url}" th:checked="${url == listing.imageUrl}"> Ảnh đại diện</label>
                            </div>
                        </div>
                    </div>
                    <div id="uploadPreviews" class="row g-3 mt-1"></div>
                </div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <a class="btn btn-light" th:href="@{/landlord/rooms}">Hủy</a><button class="btn btn-primary" type="submit">Lưu phòng</button>
            </div>
        </form>
    </main>
</div>
<div class="modal fade" id="buildingModal" tabindex="-1" aria-labelledby="buildingModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg"><div class="modal-content">
        <form id="buildingForm" th:action="@{/landlord/buildings/inline}" method="post">
            <div class="modal-header"><h2 class="modal-title fs-5" id="buildingModalLabel">Tạo khu trọ mới</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button></div>
            <div class="modal-body">
                <div id="buildingError" class="alert alert-danger d-none" role="alert"></div>
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label">Mã khu trọ *</label><input class="form-control" name="buildingCode" maxlength="20" required></div>
                    <div class="col-md-6"><label class="form-label">Tên khu trọ *</label><input class="form-control" name="buildingName" maxlength="150" required></div>
                    <div class="col-12"><label class="form-label">Địa chỉ *</label><input class="form-control" name="address" maxlength="255" required></div>
                    <div class="col-md-6"><label class="form-label">Thành phố</label><input class="form-control" name="city" maxlength="100"></div>
                    <div class="col-md-3"><label class="form-label">Số tầng</label><input class="form-control" type="number" name="totalFloors" min="1"></div>
                    <div class="col-md-3"><label class="form-label">Điện thoại liên hệ</label><input class="form-control" name="contactPhone" maxlength="20"></div>
                    <div class="col-12"><label class="form-label">Mô tả</label><textarea class="form-control" name="description" rows="3"></textarea></div>
                </div>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button><button class="btn btn-primary" type="submit">Tạo và chọn khu trọ</button></div>
        </form>
    </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const imageInput = document.getElementById('roomImages');
    const previewContainer = document.getElementById('uploadPreviews');
    const buildingSearch = document.getElementById('buildingSearch');
    const buildingSelect = document.getElementById('buildingSelect');
    buildingSearch.addEventListener('input', () => {
        const query = buildingSearch.value.trim().toLocaleLowerCase();
        Array.from(buildingSelect.options).forEach((option, index) => {
            if (index > 0) option.hidden = !option.text.toLocaleLowerCase().includes(query);
        });
    });
    imageInput.addEventListener('change', () => {
        previewContainer.replaceChildren();
        Array.from(imageInput.files).forEach((file, index) => {
            const column = document.createElement('div');
            column.className = 'col-6 col-md-3';
            const card = document.createElement('div');
            card.className = 'border rounded p-2 h-100';
            const image = document.createElement('img');
            image.className = 'img-fluid rounded mb-2';
            image.style.cssText = 'height:130px;width:100%;object-fit:cover';
            image.alt = 'Ảnh tải lên';
            image.src = URL.createObjectURL(file);
            const label = document.createElement('label');
            label.className = 'form-check small';
            const radio = document.createElement('input');
            radio.className = 'form-check-input';
            radio.type = 'radio';
            radio.name = 'primaryUploadIndex';
            radio.value = String(index);
            radio.checked = index === 0;
            label.append(radio, document.createTextNode(' Ảnh đại diện'));
            card.append(image, label);
            column.append(card);
            previewContainer.append(column);
        });
    });

    document.getElementById('buildingForm').addEventListener('submit', async event => {
        event.preventDefault();
        const form = event.currentTarget;
        const errorBox = document.getElementById('buildingError');
        errorBox.classList.add('d-none');
        try {
            const response = await fetch(form.action, {method: 'POST', body: new FormData(form)});
            const result = await response.json();
            if (!response.ok) {
                throw new Error(result.error || 'Không thể tạo khu trọ.');
            }
            const option = new Option(result.buildingName + ' — ' + result.address, result.buildingId, true, true);
            buildingSelect.add(option);
            buildingSearch.value = '';
            buildingSearch.dispatchEvent(new Event('input'));
            bootstrap.Modal.getOrCreateInstance(document.getElementById('buildingModal')).hide();
            form.reset();
        } catch (error) {
            errorBox.textContent = error.message;
            errorBox.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
