<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hợp đồng - QLPhongTro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/landlord.css}">
</head>
<body class="landlord-app"><div class="landlord-layout">
    <div th:replace="~{landlord/fragments :: sidebar(${activePage})}"></div>
    <main class="landlord-main">
        <div th:replace="~{landlord/fragments :: topbar('Hợp đồng thuê')}"></div>
        <div th:replace="~{landlord/fragments :: alerts}"></div>
        <section class="landlord-panel">
            <div class="landlord-panel-heading">
                <h2>Danh sách hợp đồng</h2>
                <a class="btn btn-primary btn-sm" th:href="@{/landlord/contracts/new}"><i class="bi bi-plus-lg me-1"></i>Tạo hợp đồng</a>
            </div>
            <div class="table-responsive">
            <table class="table landlord-table">
                <thead><tr><th>Mã hợp đồng</th><th>Phòng</th><th>Người đại diện</th><th>Thời hạn</th><th>Tiền cọc</th><th>Trạng thái</th><th></th></tr></thead>
                <tbody>
                <tr th:each="contract : ${contracts}">
                    <td class="fw-semibold" th:text="${contract.contractCode}"></td>
                    <td><span th:text="${contract.room.roomCode}"></span><small class="d-block text-secondary" th:text="${contract.room.building.buildingName}"></small></td>
                    <td><span th:text="${contract.tenantFullName ?: '—'}"></span><small class="d-block text-secondary" th:text="${contract.tenantPhone ?: '—'}"></small></td>
                    <td th:text="${(contract.startDate != null ? #temporals.format(contract.startDate, 'dd/MM/yyyy') : '—') + ' – ' + (contract.endDate != null ? #temporals.format(contract.endDate, 'dd/MM/yyyy') : 'Chưa cấu hình')}"></td>
                    <td th:text="${contract.depositAmount != null ? #numbers.formatDecimal(contract.depositAmount, 0, 'COMMA', 0, 'POINT') + ' ₫' : '—'}"></td>
                    <td th:text="${contract.status}"></td>
                    <td class="text-nowrap">
                        <a class="btn btn-outline-primary btn-sm mb-1" th:href="@{/landlord/contracts/{id}(id=${contract.contractId})}">Chi tiết / PDF</a>
                        <a class="btn btn-outline-secondary btn-sm mb-1" th:href="@{/landlord/contracts/{id}/edit(id=${contract.contractId})}">Sửa</a>
                        <button th:if="${contract.terminationRequestAllowed}"
                                class="btn btn-outline-danger btn-sm mb-1" type="button" data-bs-toggle="modal"
                                th:attr="data-bs-target=${'#terminationModal' + contract.contractId}">Đề nghị chấm dứt</button>
                        <a th:if="${contract.status != null and contract.status.equalsIgnoreCase('TERMINATION_REQUESTED')}"
                           class="btn btn-outline-warning btn-sm mb-1" th:href="@{/landlord/terminations}">Đang chờ thanh lý</a>
                        <div class="modal fade" th:id="${'terminationModal' + contract.contractId}" tabindex="-1" aria-hidden="true">
                            <div class="modal-dialog"><div class="modal-content">
                                <form method="post" th:action="@{/landlord/contracts/{id}/termination-requests(id=${contract.contractId})}">
                                    <div class="modal-header"><h5 class="modal-title">Đề nghị chấm dứt hợp đồng</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button></div>
                                    <div class="modal-body">
                                        <p class="small text-secondary" th:text="${contract.contractCode + ' · Phòng ' + contract.room.roomCode + ' · ' + contract.tenantFullName}"></p>
                                        <label class="form-label">Lý do</label>
                                        <select class="form-select mb-2" name="reasonCode" required>
                                            <option value="">Chọn lý do</option><option>Hết nhu cầu thuê</option><option>Chuyển nơi ở</option><option>Điều kiện phòng không còn phù hợp</option><option>Lý do cá nhân</option><option>Lý do khác</option>
                                        </select>
                                        <label class="form-label">Lý do chi tiết</label><textarea class="form-control mb-2" name="reasonDetails" maxlength="1500" rows="3" required></textarea>
                                        <label class="form-label">Ngày dự kiến chấm dứt</label><input class="form-control mb-2" type="date" name="expectedTerminationDate" required>
                                        <label class="form-label">Ghi chú</label><textarea class="form-control" name="notes" maxlength="2000" rows="2"></textarea>
                                        <p class="small text-warning mt-2 mb-0">Gửi đề nghị không kết thúc hợp đồng hoặc giải phóng phòng ngay.</p>
                                    </div>
                                    <div class="modal-footer"><button class="btn btn-light" type="button" data-bs-dismiss="modal">Hủy</button><button class="btn btn-danger" type="submit">Gửi đề nghị</button></div>
                                </form>
                            </div></div>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(contracts)}"><td colspan="7" class="landlord-empty">Chưa có hợp đồng thuộc khu trọ của bạn.</td></tr>
                </tbody>
            </table>
        </div></section>
    </main>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body>
</html>
