<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết phòng - QLPhongTro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/landlord.css}">
</head>
<body class="landlord-app"><div class="landlord-layout">
    <div th:replace="~{landlord/fragments :: sidebar(${activePage})}"></div>
    <main class="landlord-main">
        <div th:replace="~{landlord/fragments :: topbar('Chi tiết phòng')}"></div>
        <section class="landlord-form-card">
            <h2 class="h4 fw-bold" th:text="${room.roomCode}"></h2>
            <dl class="row mt-4">
                <dt class="col-sm-4">Tiêu đề</dt><dd class="col-sm-8" th:text="${listing.title}"></dd>
                <dt class="col-sm-4">Khu trọ</dt><dd class="col-sm-8" th:text="${room.building.buildingName}"></dd>
                <dt class="col-sm-4">Địa chỉ</dt><dd class="col-sm-8" th:text="${room.building.address}"></dd>
                <dt class="col-sm-4">Thành phố</dt><dd class="col-sm-8" th:text="${room.building.city ?: '—'}"></dd>
                <dt class="col-sm-4">Tầng</dt><dd class="col-sm-8" th:text="${room.floorNo ?: '—'}"></dd>
                <dt class="col-sm-4">Sức chứa</dt><dd class="col-sm-8" th:text="${room.maxOccupants ?: '—'}"></dd>
                <dt class="col-sm-4">Giá thuê riêng</dt><dd class="col-sm-8" th:text="${room.priceOverride != null ? #numbers.formatDecimal(room.priceOverride, 0, 'COMMA', 0, 'POINT') + ' ₫' : 'Theo loại phòng'}"></dd>
                <dt class="col-sm-4">Trạng thái</dt><dd class="col-sm-8" th:text="${room.status}"></dd>
                <dt class="col-sm-4">Diện tích</dt><dd class="col-sm-8" th:text="${listing.area + ' m²'}"></dd>
                <dt class="col-sm-4">Mô tả</dt><dd class="col-sm-8" th:text="${listing.description ?: '—'}"></dd>
                <dt class="col-sm-4">Tiện nghi</dt><dd class="col-sm-8" th:text="${listing.amenities ?: '—'}"></dd>
            </dl>
            <div class="d-flex flex-wrap gap-2 mb-3">
                <img th:each="imageUrl : ${listing.galleryList}" th:src="${imageUrl}" alt="Ảnh phòng"
                     style="width:160px;height:120px;object-fit:cover;border-radius:8px">
            </div>
            <a class="btn btn-outline-secondary" th:href="@{/landlord/rooms}">Quay lại</a>
            <a class="btn btn-primary" th:href="@{/landlord/rooms/{id}/edit(id=${room.roomId})}">Chỉnh sửa</a>
        </section>
    </main>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body>
</html>
