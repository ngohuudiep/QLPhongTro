<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xác nhận tiền cọc - QLPhongTro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/landlord.css}">
</head>
<body class="landlord-app">
<div class="landlord-layout">
    <div th:replace="~{landlord/fragments :: sidebar(${activePage})}"></div>
    <main class="landlord-main">
        <div th:replace="~{landlord/fragments :: topbar('Yêu cầu xác nhận tiền cọc')}"></div>
        <div th:replace="~{landlord/fragments :: alerts}"></div>
        <section class="landlord-panel">
            <div class="landlord-panel-heading">
                <div>
                    <h2>Yêu cầu xác nhận tiền cọc</h2>
                    <p class="text-secondary mb-0">Chỉ xác nhận sau khi đã đối chiếu việc nhận tiền thực tế.</p>
                </div>
                <form method="get" th:action="@{/landlord/rental/deposit-requests}" class="d-flex gap-2">
                    <label class="visually-hidden" for="deposit-request-status">Lọc trạng thái</label>
                    <select class="form-select" id="deposit-request-status" name="status">
                        <option value="PENDING" th:selected="${selectedStatus == 'PENDING'}">Chờ xử lý</option>
                        <option value="APPROVED" th:selected="${selectedStatus == 'APPROVED'}">Đã xác nhận</option>
                        <option value="REJECTED" th:selected="${selectedStatus == 'REJECTED'}">Đã từ chối</option>
                        <option value="ALL" th:selected="${selectedStatus == 'ALL'}">Tất cả</option>
                    </select>
                    <button class="btn btn-outline-primary" type="submit">Lọc</button>
                </form>
            </div>
            <div class="table-responsive">
                <table class="table landlord-table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Người thuê / Hợp đồng</th>
                        <th>Phòng</th>
                        <th>Tiền cọc</th>
                        <th>Ngày gửi</th>
                        <th>Trạng thái / phản hồi</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="request : ${requests}">
                        <td>
                            <strong th:text="${request.contract.tenantFullName ?: (request.tenantUser.fullName ?: request.tenantUser.username)}"></strong>
                            <div class="small text-secondary">
                                <span th:text="${request.tenantUser.phone ?: 'Chưa có số điện thoại'}"></span>
                                · <a th:href="@{/landlord/rental/contracts/{id}(id=${request.contract.contractId})}"
                                     th:text="${request.contract.contractCode}"></a>
                            </div>
                        </td>
                        <td th:text="${request.contract.room.roomCode}"></td>
                        <td th:text="${#numbers.formatDecimal(request.amount,0,'COMMA',0,'POINT') + ' ₫'}"></td>
                        <td th:text="${#temporals.format(request.requestedAt,'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${request.status == 'PENDING' ? ' text-bg-warning' : (request.status == 'APPROVED' ? ' text-bg-success' : ' text-bg-danger')}"
                                  th:text="${request.statusLabel}"></span>
                            <div class="small text-danger mt-1"
                                 th:if="${request.status == 'REJECTED'}"
                                 th:text="${request.rejectionReason}"></div>
                            <div class="small text-secondary mt-1"
                                 th:if="${request.respondedAt != null}"
                                 th:text="${'Phản hồi lúc ' + #temporals.format(request.respondedAt,'dd/MM/yyyy HH:mm')}"></div>
                        </td>
                        <td>
                            <div th:if="${request.status == 'PENDING'}" class="d-flex flex-column gap-2">
                                <form method="post"
                                      th:action="@{/landlord/rental/deposit-requests/{requestId}/approve(requestId=${request.requestId})}"
                                      class="d-flex gap-2">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <input class="form-control form-control-sm" name="referenceNo" maxlength="50"
                                           placeholder="Mã tham chiếu (tùy chọn)" aria-label="Mã tham chiếu">
                                    <button class="btn btn-sm btn-success text-nowrap" type="submit"
                                            onclick="return confirm('Chỉ xác nhận sau khi đã kiểm tra và nhận đủ tiền cọc?')">
                                        Đã nhận tiền
                                    </button>
                                </form>
                                <form method="post"
                                      th:action="@{/landlord/rental/deposit-requests/{requestId}/reject(requestId=${request.requestId})}">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <textarea class="form-control form-control-sm mb-1" name="reason" required
                                              maxlength="4000" rows="2" placeholder="Lý do từ chối"></textarea>
                                    <button class="btn btn-sm btn-outline-danger" type="submit">Từ chối yêu cầu</button>
                                </form>
                            </div>
                            <span th:if="${request.status != 'PENDING'}" class="text-secondary small">
                                Đã xử lý
                            </span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(requests)}">
                        <td colspan="6" class="text-center text-secondary py-4">Không có yêu cầu ở trạng thái này.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
