<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông báo - QLPhongTro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/landlord.css}">
</head>
<body class="landlord-app">
<div class="landlord-layout">
    <div th:replace="~{landlord/fragments :: sidebar(${activePage})}"></div>
    <main class="landlord-main">
        <div th:replace="~{landlord/fragments :: topbar('Thông báo')}"></div>
        <section class="landlord-panel">
            <div class="landlord-panel-heading"><h2>Thông báo dành cho bạn</h2><span class="text-secondary small" th:text="${notifications.size() + ' thông báo'}"></span></div>
            <div class="d-grid gap-2">
                <article class="border rounded-3 p-3 d-flex flex-wrap justify-content-between align-items-center gap-3"
                         th:each="notification : ${notifications}"
                         th:classappend="${notification.read ? ' bg-white' : ' bg-primary-subtle'}">
                    <div class="flex-grow-1"><div class="d-flex align-items-center gap-2"><i class="bi bi-bell text-primary"></i><strong th:text="${notification.title}"></strong><span class="badge text-bg-primary" th:if="${!notification.read}">Mới</span></div>
                        <p class="mb-1 mt-2" th:text="${notification.message}"></p>
                        <small class="text-secondary" th:text="${#temporals.format(notification.createdAt,'dd/MM/yyyy HH:mm')}"></small>
                    </div>
                    <form method="post" th:action="@{/landlord/notifications/{id}/open(id=${notification.notificationId})}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-outline-primary" type="submit">Mở chi tiết <i class="bi bi-arrow-right"></i></button>
                    </form>
                </article>
                <div class="text-center text-secondary py-5" th:if="${#lists.isEmpty(notifications)}"><i class="bi bi-bell-slash fs-2 d-block mb-2"></i>Chưa có thông báo.</div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
