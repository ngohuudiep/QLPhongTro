<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phòng trọ của tôi - QLPhongTro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/landlord.css}">
</head>
<body class="landlord-app"><div class="landlord-layout">
    <div th:replace="~{landlord/fragments :: sidebar(${activePage})}"></div>
    <main class="landlord-main">
        <div th:replace="~{landlord/fragments :: topbar('Quản lý phòng trọ')}"></div>
        <div th:replace="~{landlord/fragments :: alerts}"></div>
        <section class="landlord-panel">
            <div class="landlord-panel-heading d-flex flex-wrap justify-content-between align-items-center gap-2">
                <h2>Danh sách phòng thuộc quyền quản lý</h2>
                <a th:href="@{/landlord/rooms/new}" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Thêm phòng</a>
            </div>
            <form class="row g-2 p-3 border-bottom" method="get" th:action="@{/landlord/rooms}">
                <div class="col-md-7"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm mã phòng, khu trọ hoặc địa chỉ"></div>
                <div class="col-md-3">
                    <select class="form-select" name="status">
                        <option value="ALL" th:selected="${selectedStatus == 'ALL'}">Tất cả trạng thái</option>
                        <option value="TRONG" th:selected="${selectedStatus == 'TRONG'}">Còn trống</option>
                        <option value="DA_THUE" th:selected="${selectedStatus == 'DA_THUE'}">Đang thuê</option>
                        <option value="BAO_TRI" th:selected="${selectedStatus == 'BAO_TRI'}">Bảo trì</option>
                    </select>
                </div>
                <div class="col-md-2 d-grid"><button class="btn btn-outline-primary" type="submit">Lọc</button></div>
            </form>
            <div class="table-responsive">
                <table class="table landlord-table">
                    <thead><tr><th>Mã phòng</th><th>Khu trọ / Địa chỉ</th><th>Tầng</th><th>Sức chứa</th><th>Giá riêng</th><th>Trạng thái</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="room : ${rooms}">
                        <td class="fw-semibold" th:text="${room.roomCode}"></td>
                        <td><span th:text="${room.building.buildingName}"></span><small class="d-block text-secondary" th:text="${room.building.address}"></small></td>
                        <td th:text="${room.floorNo ?: '—'}"></td>
                        <td th:text="${room.maxOccupants != null ? room.maxOccupants + ' người' : '—'}"></td>
                        <td th:text="${room.priceOverride != null ? #numbers.formatDecimal(room.priceOverride, 0, 'COMMA', 0, 'POINT') + ' ₫' : 'Theo loại phòng'}"></td>
                        <td><span class="badge text-bg-success" th:if="${room.status == 'TRONG' or room.status == 'Trống'}">Còn trống</span><span class="badge text-bg-primary" th:if="${room.status == 'DA_THUE' or room.status == 'Đang thuê'}">Đang thuê</span><span class="badge text-bg-warning" th:if="${room.status == 'BAO_TRI' or room.status == 'Bảo trì'}">Bảo trì</span></td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/landlord/rooms/{id}(id=${room.roomId})}" aria-label="Chi tiết">Xem</a>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/landlord/rooms/{id}/edit(id=${room.roomId})}">Sửa</a>
                            <form class="d-inline" method="post" th:action="@{/landlord/rooms/{id}/delete(id=${room.roomId})}" onsubmit="return confirm('Bạn chắc chắn muốn xóa phòng này?');">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(rooms)}"><td colspan="7" class="landlord-empty">Chưa có phòng thuộc khu trọ của bạn. Hãy tạo khu trọ trước khi thêm phòng.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body>
</html>
