<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Người thuê - QLPhongTro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/landlord.css}">
</head>
<body class="landlord-app"><div class="landlord-layout">
    <div th:replace="~{landlord/fragments :: sidebar(${activePage})}"></div>
    <main class="landlord-main">
        <div th:replace="~{landlord/fragments :: topbar('Người thuê')}"></div>
        <p class="text-secondary small">Danh sách lấy từ người thuê được liên kết trực tiếp trên hợp đồng hiện hành của các phòng thuộc khu trọ bạn sở hữu.</p>
        <section class="landlord-panel">
            <form class="p-3 border-bottom" method="get" th:action="@{/landlord/tenants}">
                <div class="input-group"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm tên, số điện thoại, mã phòng hoặc mã hợp đồng"><button class="btn btn-outline-primary" type="submit">Tìm kiếm</button></div>
            </form>
            <div class="table-responsive">
                <table class="table landlord-table">
                    <thead><tr><th>Người thuê</th><th>Phòng</th><th>Hợp đồng</th><th>Thời hạn</th><th>Trạng thái</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="tenant : ${tenants}">
                        <td><div class="fw-semibold" th:text="${tenant.fullName() ?: 'Chưa có tên'}"></div>
                            <small class="d-block text-secondary" th:text="${tenant.phone() ?: 'Chưa có số điện thoại'}"></small>
                            <small class="d-block text-secondary" th:if="${tenant.username() != null}" th:text="${'@' + tenant.username()}"></small></td>
                        <td class="fw-semibold" th:text="${tenant.roomCode()}"></td>
                        <td th:text="${tenant.contractCode()}"></td>
                        <td th:text="${(tenant.startDate() != null ? #temporals.format(tenant.startDate(), 'dd/MM/yyyy') : '—') + ' – ' + (tenant.endDate() != null ? #temporals.format(tenant.endDate(), 'dd/MM/yyyy') : 'Chưa xác định')}"></td>
                        <td><span class="badge text-bg-light" th:text="${tenant.contractStatusLabel()}"></span></td>
                        <td><a class="btn btn-sm btn-outline-primary" th:href="@{/landlord/contracts/{id}(id=${tenant.contractId()})}">Chi tiết hợp đồng</a></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(tenants)}"><td colspan="6" class="landlord-empty">Chưa có người thuê gắn với hợp đồng hiện hành thuộc khu trọ của bạn.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body>
</html>
