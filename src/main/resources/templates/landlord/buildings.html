<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Khu trọ của tôi - QLPhongTro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/landlord.css}">
</head>
<body class="landlord-app"><div class="landlord-layout">
    <div th:replace="~{landlord/fragments :: sidebar(${activePage})}"></div>
    <main class="landlord-main">
        <div th:replace="~{landlord/fragments :: topbar('Khu trọ của tôi')}"></div>
        <div th:replace="~{landlord/fragments :: alerts}"></div>
        <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
            <p class="text-secondary mb-0">Chỉ các khu trọ do tài khoản của bạn sở hữu được hiển thị.</p>
            <a th:href="@{/landlord/buildings/new}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Thêm khu trọ</a>
        </div>
        <section class="landlord-panel">
            <div class="table-responsive">
                <table class="table landlord-table">
                    <thead><tr><th>Mã</th><th>Tên khu trọ</th><th>Địa chỉ</th><th>Thành phố</th><th>Điện thoại</th><th>Số tầng</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="building : ${buildings}">
                        <td class="fw-semibold" th:text="${building.buildingCode}"></td>
                        <td th:text="${building.buildingName}"></td>
                        <td th:text="${building.address}"></td>
                        <td th:text="${building.city ?: '—'}"></td>
                        <td th:text="${building.contactPhone ?: '—'}"></td>
                        <td th:text="${building.totalFloors ?: '—'}"></td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/landlord/buildings/{id}/edit(id=${building.buildingId})}">Sửa</a>
                            <form class="d-inline" method="post" th:action="@{/landlord/buildings/{id}/delete(id=${building.buildingId})}" onsubmit="return confirm('Xóa khu trọ này? Chỉ được xóa khi không còn phòng.');">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(buildings)}"><td colspan="7" class="landlord-empty">Bạn chưa tạo khu trọ nào.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body>
</html>
