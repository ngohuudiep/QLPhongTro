<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg main-navbar py-2">
    <div class="container">
        <!-- Logo -->
        <a class="brand-logo" th:href="@{/}">
            <div class="brand-icon">
                <i class="bi bi-houses"></i>
            </div>
            <span>QLPhongTro</span>
        </a>

        <!-- Mobile Toggler -->
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <i class="bi bi-list fs-2 text-primary"></i>
        </button>

        <!-- Nav Items -->
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto ms-lg-4 mb-2 mb-lg-0 gap-lg-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}" th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI == '/' ? 'active' : ''}">
                        <i class="bi bi-house-door me-1"></i> Trang chủ
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/rooms/list}" th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI == '/rooms/list' ? 'active' : ''}">
                        <i class="bi bi-grid me-1"></i> Tìm phòng trọ
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'STAFF')">
                    <a class="nav-link" th:href="@{/admin/dashboard}" th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI == '/admin/dashboard' ? 'active' : ''}">
                        <i class="bi bi-speedometer2 me-1"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/rooms}" th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI == '/admin/rooms' ? 'active' : ''}">
                        <i class="bi bi-sliders me-1"></i> Quản lý phòng
                    </a>
                </li>
            </ul>

            <!-- Right Controls -->
            <div class="d-flex align-items-center gap-3">
                <!-- Dark Mode Button -->
                <button type="button" class="theme-toggle-btn shadow-sm" onclick="toggleDarkMode()" title="Chuyển chế độ Sáng / Tối">
                    <i id="themeIcon" class="bi bi-moon-stars-fill text-muted"></i>
                </button>

                <!-- When NOT Authenticated -->
                <div sec:authorize="isAnonymous()" class="d-flex align-items-center gap-2">
                    <a th:href="@{/login}" class="btn btn-sm btn-outline-primary px-3">
                        <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
                    </a>
                    <a th:href="@{/register}" class="btn btn-sm btn-primary px-3">
                        <i class="bi bi-person-plus"></i> Đăng ký
                    </a>
                </div>

                <!-- When Authenticated -->
                <div sec:authorize="isAuthenticated()" class="dropdown">
                    <button class="btn btn-light d-flex align-items-center gap-2 px-3 py-2 border shadow-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="rounded-circle bg-teal-100 text-primary d-flex align-items-center justify-content-center fw-bold" style="width: 32px; height: 32px; background: rgba(13,148,136,0.15); color: #0d9488;">
                            <span sec:authentication="name" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
                        </div>
                        <span class="fw-semibold text-truncate" style="max-width: 120px;" sec:authentication="name">User</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 py-2 mt-2" style="border-radius: 12px; min-width: 220px;">
                        <li class="px-3 py-2 border-bottom mb-1">
                            <div class="fw-bold" sec:authentication="name">Tài khoản</div>
                            <div class="badge-status badge-status-empty py-0 px-2 mt-1" style="font-size: 0.72rem;">
                                <span sec:authorize="hasRole('ADMIN')">Chủ trọ (Admin)</span>
                                <span sec:authorize="hasRole('STAFF')">Nhân viên</span>
                                <span sec:authorize="hasRole('USER')">Người thuê</span>
                            </div>
                        </li>
                        <li>
                            <a class="dropdown-item py-2" th:href="@{/profile}">
                                <i class="bi bi-person-gear me-2 text-primary"></i> Hồ sơ cá nhân
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item py-2" th:href="@{/profile#change-password}">
                                <i class="bi bi-key me-2 text-warning"></i> Đổi mật khẩu
                            </a>
                        </li>
                        <li><hr class="dropdown-divider my-1"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-2">
                                <button type="submit" class="dropdown-item text-danger rounded-2 py-2">
                                    <i class="bi bi-box-arrow-right me-2"></i> Đăng xuất
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

</body>
</html>
