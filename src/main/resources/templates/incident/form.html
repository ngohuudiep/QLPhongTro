<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${incident.incidentId != null ? 'Cập nhật sự cố' : 'Báo cáo sự cố mới'} + ' - Quản lý phòng trọ'">Báo cáo sự cố</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h4 class="card-title mb-0 fw-bold text-primary">
                        <i class="bi bi-tools me-2"></i>
                        <span th:text="${incident.incidentId != null ? 'Cập nhật tiến độ xử lý sự cố' : 'Ghi nhận báo cáo sự cố mới'}"></span>
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/incidents/save}" th:object="${incident}" method="post">
                        <input type="hidden" th:field="*{incidentId}" />

                        <div class="row g-3">
                            <!-- 1. Phòng xảy ra sự cố -->
                            <div class="col-md-6">
                                <label for="room" class="form-label fw-semibold">Phòng bị sự cố <span class="text-danger">*</span></label>
                                <select class="form-select" id="room" th:field="*{room}" required>
                                    <option value="" disabled selected>-- Chọn phòng --</option>
                                    <option th:each="r : ${rooms}" 
                                            th:value="${r.roomId}" 
                                            th:text="${r.roomCode + ' - ' + (r.building != null ? r.building.buildingName : '')}">
                                        P.101
                                    </option>
                                </select>
                            </div>

                            <!-- 2. Mức độ ưu tiên (Priority) -->
                            <div class="col-md-6">
                                <label for="priority" class="form-label fw-semibold">Mức độ ưu tiên <span class="text-danger">*</span></label>
                                <select class="form-select" id="priority" th:field="*{priority}" required>
                                    <option value="High" class="text-danger fw-bold">🔴 High (Cao / Khẩn cấp)</option>
                                    <option value="Medium" class="text-warning fw-bold" selected>🟡 Medium (Trung bình)</option>
                                    <option value="Low" class="text-success fw-bold">🟢 Low (Thấp / Không gấp)</option>
                                </select>
                            </div>

                            <!-- 3. Tiêu đề / Mô tả sự cố -->
                            <div class="col-12">
                                <label for="title" class="form-label fw-semibold">Mô tả sự cố <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="title" th:field="*{title}" 
                                       placeholder="Ví dụ: Rò rỉ nước bồn cầu, chập cầu dao điện..." required maxlength="200">
                            </div>

                            <!-- 4. Trạng thái xử lý -->
                            <div class="col-md-6">
                                <label for="status" class="form-label fw-semibold">Trạng thái xử lý</label>
                                <select class="form-select" id="status" th:field="*{status}">
                                    <option value="Tiếp nhận" selected>Tiếp nhận</option>
                                    <option value="Đang xử lý">Đang xử lý</option>
                                    <option value="Hoàn thành">Hoàn thành</option>
                                    <option value="Đã hủy">Đã hủy</option>
                                </select>
                            </div>

                            <!-- 5. Chi phí sửa chữa -->
                            <div class="col-md-6">
                                <label for="repairCost" class="form-label fw-semibold">Chi phí sửa chữa (VNĐ)</label>
                                <div class="input-group">
                                    <input type="number" step="1000" min="0" class="form-control" 
                                           id="repairCost" th:field="*{repairCost}" placeholder="Ví dụ: 200000">
                                    <span class="input-group-text">₫</span>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/incidents}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Quay lại
                            </a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-save me-1"></i> Lưu thông tin
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
