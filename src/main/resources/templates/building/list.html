<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách tòa nhà - Quản lý phòng trọ</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <!-- Thông báo nếu có -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm mb-4" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}">Thao tác thành công!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h4 class="card-title mb-0 fw-bold text-primary">
                <i class="bi bi-building me-2"></i>Danh sách tòa nhà
            </h4>
            <!-- Nút Thêm mới -->
            <a th:href="@{/buildings/new}" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Thêm tòa nhà
            </a>
        </div>
        
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-primary text-nowrap">
                        <tr>
                            <th class="text-center" style="width: 80px;">ID</th>
                            <th>Mã tòa</th>
                            <th>Tên tòa nhà</th>
                            <th>Địa chỉ</th>
                            <th>Thành phố</th>
                            <th class="text-center">Số tầng</th>
                            <th class="text-center" style="width: 180px;">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Lặp danh sách tòa nhà -->
                        <tr th:each="building : ${buildings}">
                            <td class="text-center fw-bold text-secondary" th:text="${building.buildingId}">1</td>
                            <td>
                                <span class="badge bg-secondary-subtle text-secondary-emphasis font-monospace fw-semibold" 
                                      th:text="${building.buildingCode}">TN01</span>
                            </td>
                            <td class="fw-semibold text-primary" th:text="${building.buildingName}">Tòa nhà Sunshine</td>
                            <td th:text="${building.address}">Số 123 Đường Cầu Giấy</td>
                            <td>
                                <span class="badge bg-light text-dark border" th:text="${building.city != null ? building.city : '—'}">Hà Nội</span>
                            </td>
                            <td class="text-center">
                                <span class="fw-semibold" th:text="${building.totalFloors != null ? building.totalFloors + ' tầng' : '—'}">5 tầng</span>
                            </td>
                            <td class="text-center">
                                <!-- Nút Sửa -->
                                <a th:href="@{/buildings/edit/{id}(id=${building.buildingId})}" 
                                   class="btn btn-sm btn-outline-primary me-1" title="Chỉnh sửa">
                                    <i class="bi bi-pencil-square"></i> Sửa
                                </a>
                                <!-- Nút Xóa -->
                                <a th:href="@{/buildings/delete/{id}(id=${building.buildingId})}" 
                                   class="btn btn-sm btn-outline-danger" title="Xóa"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa tòa nhà này không?');">
                                    <i class="bi bi-trash"></i> Xóa
                                </a>
                            </td>
                        </tr>

                        <!-- Thông báo khi danh sách rỗng -->
                        <tr th:if="${#lists.isEmpty(buildings)}">
                            <td colspan="7" class="text-center py-5 text-muted">
                                <i class="bi bi-building-slash fs-2 d-block mb-2 text-secondary"></i>
                                Chưa có tòa nhà nào trong hệ thống.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
