<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Chi tiết hóa đơn ' + ${invoice.invoiceCode} + ' - Quản lý phòng trọ'">Chi tiết hóa đơn</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="mb-3">
        <a th:href="@{/invoices}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách hóa đơn
        </a>
    </div>

    <!-- Thông báo nếu có -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm mb-4" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <!-- Cột trái: Thông tin hóa đơn -->
        <div class="col-lg-7">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0 fw-bold text-primary">
                        <i class="bi bi-receipt me-2"></i>Hóa đơn: <span th:text="${invoice.invoiceCode}"></span>
                    </h5>
                    <span th:if="${invoice.status == 'Đã thanh toán' or invoice.status == 'PAID'}" class="badge bg-success fs-6">Đã thanh toán</span>
                    <span th:if="${invoice.status == 'Chưa thanh toán' or invoice.status == 'UNPAID'}" class="badge bg-warning text-dark fs-6">Chưa thanh toán</span>
                </div>
                <div class="card-body p-4">
                    <div class="row mb-3">
                        <div class="col-sm-4 text-muted">Hợp đồng thuê:</div>
                        <div class="col-sm-8 fw-bold" th:text="${invoice.contract != null ? invoice.contract.contractCode : '—'}"></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 text-muted">Phòng:</div>
                        <div class="col-sm-8 fw-semibold text-primary" 
                             th:text="${invoice.contract != null and invoice.contract.room != null ? invoice.contract.room.roomCode : '—'}"></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 text-muted">Người đại diện:</div>
                        <div class="col-sm-8" 
                             th:text="${invoice.contract != null and invoice.contract.representative != null ? invoice.contract.representative.fullName : '—'}"></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 text-muted">Kỳ hóa đơn:</div>
                        <div class="col-sm-8" 
                             th:text="${#temporals.format(invoice.periodStart, 'dd/MM/yyyy')} + ' đến ' + ${#temporals.format(invoice.periodEnd, 'dd/MM/yyyy')}"></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 text-muted">Hạn thanh toán:</div>
                        <div class="col-sm-8 text-danger fw-semibold" th:text="${#temporals.format(invoice.dueDate, 'dd/MM/yyyy')}"></div>
                    </div>
                    <hr>
                    <div class="row align-items-center">
                        <div class="col-sm-4 fs-5 text-muted">Tổng cộng:</div>
                        <div class="col-sm-8 fs-3 fw-bold text-success" 
                             th:text="${invoice.totalAmount != null ? #numbers.formatDecimal(invoice.totalAmount, 0, 'COMMA', 0, 'POINT') + ' ₫' : '0 ₫'}"></div>
                    </div>
                </div>
            </div>

            <!-- Bảng lịch sử các lần thanh toán -->
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h6 class="card-title mb-0 fw-bold text-dark">
                        <i class="bi bi-clock-history me-2"></i>Lịch sử thanh toán (Payments)
                    </h6>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Thời gian</th>
                                    <th>Phương thức</th>
                                    <th>Mã tham chiếu</th>
                                    <th class="text-end">Số tiền</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${payments}">
                                    <td th:text="${#temporals.format(p.paidAt, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td><span class="badge bg-secondary" th:text="${p.method}"></span></td>
                                    <td class="font-monospace text-muted" th:text="${p.referenceNo != null ? p.referenceNo : '—'}"></td>
                                    <td class="text-end fw-bold text-success font-monospace" 
                                        th:text="${#numbers.formatDecimal(p.amount, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(payments)}">
                                    <td colspan="4" class="text-center py-4 text-muted">Chưa có giao dịch thanh toán nào.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cột phải: Form thanh toán -->
        <div class="col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h5 class="card-title mb-0 fw-bold text-success">
                        <i class="bi bi-credit-card me-2"></i>Ghi nhận thanh toán
                    </h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/invoices/{id}/pay(id=${invoice.invoiceId})}" method="post">
                        <div class="mb-3">
                            <label for="amount" class="form-label fw-semibold">Số tiền thanh toán (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" step="1000" min="1000" class="form-control form-control-lg fw-bold text-success" 
                                   id="amount" name="amount" th:value="${invoice.totalAmount}" required>
                        </div>

                        <div class="mb-3">
                            <label for="method" class="form-label fw-semibold">Phương thức thanh toán <span class="text-danger">*</span></label>
                            <select class="form-select" id="method" name="method" required>
                                <option value="Chuyển khoản" selected>Chuyển khoản ngân hàng</option>
                                <option value="Tiền mặt">Tiền mặt</option>
                                <option value="Ví điện tử">Ví điện tử (Momo, ZaloPay)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="referenceNo" class="form-label fw-semibold">Mã giao dịch / Ghi chú</label>
                            <input type="text" class="form-control" id="referenceNo" name="referenceNo" 
                                   placeholder="Ví dụ: FT261014123456">
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fs-6">
                            <i class="bi bi-check-circle me-1"></i> Xác nhận đã thanh toán
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
