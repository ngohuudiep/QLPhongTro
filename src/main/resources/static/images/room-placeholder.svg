<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Subtle geometric decorations -->
  <circle cx="120" cy="100" r="140" fill="#ffffff" fill-opacity="0.04" />
  <circle cx="700" cy="400" r="180" fill="#ffffff" fill-opacity="0.04" />

  <!-- Glassmorphism Central Card -->
  <rect x="250" y="100" width="300" height="260" rx="24" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />

  <!-- House & Bed Icon -->
  <g transform="translate(350, 150)">
    <!-- House outline -->
    <path d="M50 5 L90 40 L80 40 L80 80 L20 80 L20 40 L10 40 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Door / Window -->
    <rect x="40" y="50" width="20" height="30" rx="3" fill="#ffffff" fill-opacity="0.3" stroke="#ffffff" stroke-width="2" />
    <line x1="50" y1="50" x2="50" y2="80" stroke="#ffffff" stroke-width="2" />
    <!-- Bed indicator -->
    <path d="M28 65 L28 75 M72 65 L72 75 M28 70 L72 70" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Title Text -->
  <text x="400" y="290" text-anchor="middle" fill="#ffffff" font-family="'Be Vietnam Pro', 'Inter', sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">
    HÌNH ẢNH ĐANG CẬP NHẬT
  </text>
  <text x="400" y="320" text-anchor="middle" fill="#ccfbf1" font-family="'Be Vietnam Pro', 'Inter', sans-serif" font-size="14" font-weight="500">
    Hệ Thống Quản Lý Phòng Trọ Cao Cấp
  </text>
</svg>
