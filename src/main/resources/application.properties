# Tên ứng dụng và cổng chạy
spring.application.name=QLPhongTro
server.port=8080

# Cấu hình Encoding UTF-8 toàn diện (Backend & HTTP Response)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true

# Cấu hình kết nối SQL Server (Instance SQLEXPRESS01, Database ApartmentDB)
# sendStringParametersAsUnicode=true đảm bảo mọi chuỗi tiếng Việt gửi xuống DB dùng Unicode NVARCHAR chuẩn
spring.datasource.url=jdbc:sqlserver://localhost:1433;instanceName=SQLEXPRESS01;databaseName=ApartmentDB;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;characterEncoding=UTF-8;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=123456

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.sql.init.encoding=UTF-8

# Cấu hình Thymeleaf UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
