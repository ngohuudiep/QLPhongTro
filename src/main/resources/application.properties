# Tên ứng dụng và cổng chạy
spring.application.name=QLPhongTro
server.port=8080
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
app.mail.from=${SMTP_FROM:no-reply@example.invalid}

# Cấu hình Upload và Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
app.upload.room-images-dir=${user.home}/qlphongtro-data/room-images
app.security.remember-me-key=${REMEMBER_ME_KEY:test-only-remember-me-key}

# Cấu hình Encoding UTF-8 toàn diện (Backend & HTTP Response)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true

# Cấu hình kết nối SQL Server (Instance SQLEXPRESS01, Database ApartmentDB)
# sendStringParametersAsUnicode=true đảm bảo mọi chuỗi tiếng Việt gửi xuống DB dùng Unicode NVARCHAR chuẩn
spring.datasource.url=jdbc:sqlserver://localhost:1433;instanceName=SQLEXPRESS01;databaseName=ApartmentDB;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;characterEncoding=UTF-8;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=123456

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.sql.init.encoding=UTF-8

# Cấu hình Flyway Migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.encoding=UTF-8
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}

# Cấu hình Thymeleaf UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
